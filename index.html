<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paisa Planner</title>
<meta name="description" content="Plan your monthly budget, log spending in seconds and never miss a bill or EMI.">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0D0E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paisa">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/manrope-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Manrope";font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/manrope-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* system font sized to Manrope's wider letters, so nothing reflows when Manrope arrives */
@font-face{font-family:"Manrope Fallback";src:local("Arial"),local("Helvetica Neue"),local("Roboto");size-adjust:110%;ascent-override:97%;descent-override:27%;line-gap-override:0%}
/* Layout: one phone-width column; sticky month bar on top, five tabs + floating add at the bottom. */
:root{
  --bg:#F4F4F2; --surface:#FFFFFF; --sunk:#EDEDEA; --ink:#121314; --muted:#6A6D70; --line:#E3E3DF;
  --accent:#111213; --accent-ink:#FFFFFF; --accent-soft:#ECECEA; --hero:#F1F1EE; --nav:#0D0E0F; --nav-ink:#8C8F93; --gold:#E9B44C;
  --good:#1D7F52; --good-soft:#DDF1E6; --bad:#BF3328; --bad-soft:#FBE3E0; --warn:#9A6411; --warn-soft:#FBEED6;
  --c-income:#7C8A84; --c-savings:#2C47C9; --c-bills:#6E82DA; --c-expenses:#AEB9EA; --c-debt:#15226E;
  --shadow:0 1px 2px rgba(20,32,27,.06),0 8px 24px rgba(20,32,27,.08);
  --f-display:"Manrope","Manrope Fallback",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Manrope","Manrope Fallback",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0D0E; --surface:#121415; --sunk:#1D2022; --ink:#F1F2F2; --muted:#9A9EA2; --line:#26292B;
  --accent:#F3F3F1; --accent-ink:#0C0D0E; --accent-soft:#26282A; --hero:#17191A; --nav:#050606; --nav-ink:#7D8186; --gold:#E9B44C;
  --good:#5CCB92; --good-soft:#18352A; --bad:#FF8577; --bad-soft:#3D1F1C; --warn:#F2B451; --warn-soft:#3A2E17;
  --c-income:#8A9893; --c-savings:#8EA2FF; --c-bills:#5E70C4; --c-expenses:#36437D; --c-debt:#CDD6FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0D0E; --surface:#121415; --sunk:#1D2022; --ink:#F1F2F2; --muted:#9A9EA2; --line:#26292B;
  --accent:#F3F3F1; --accent-ink:#0C0D0E; --accent-soft:#26282A; --hero:#17191A; --nav:#050606; --nav-ink:#7D8186; --gold:#E9B44C;
  --good:#5CCB92; --good-soft:#18352A; --bad:#FF8577; --bad-soft:#3D1F1C; --warn:#F2B451; --warn-soft:#3A2E17;
  --c-income:#8A9893; --c-savings:#8EA2FF; --c-bills:#5E70C4; --c-expenses:#36437D; --c-debt:#CDD6FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-optical-sizing:auto;font-feature-settings:normal}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.022em;font-weight:700}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px}
.topbar h1{font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mswitch{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.mswitch button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted)}
.mswitch button:hover{background:var(--sunk)}
.mswitch span{font-weight:600;font-size:14px;min-width:78px;text-align:center}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero .big{font-family:var(--f-display);font-size:clamp(32px,9vw,42px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.hero .big.neg{color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:12px;padding-block:6px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
/* chips + pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-paid{background:var(--good-soft);color:var(--good)}
.p-overdue{background:var(--bad-soft);color:var(--bad)}
.p-due{background:var(--warn-soft);color:var(--warn)}
.p-up{background:var(--sunk);color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:14px}
.alert b{font-weight:600}
.a-bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;background:currentColor}
/* rows */
.row{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted)}
.row .amt{font-weight:600;text-align:right;white-space:nowrap}
.rowbtn{width:100%;text-align:left;background:none;border:0;padding:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%;padding:13px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
/* sections */
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.bar{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:999px}
.over{color:var(--bad);font-weight:600}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:26;right:max(18px,calc(50vw - 262px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);font-size:30px;line-height:1;display:grid;place-items:center}
@media (max-width:560px){.fab{right:calc(18px + env(safe-area-inset-right,0px))}}
/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,16,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet h2{font-size:18px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.x{border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;font-size:18px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .sw{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:2px;vertical-align:1px}
.amtdisp{font-family:var(--f-display);font-size:40px;font-weight:700;text-align:center;padding:6px 0 10px;letter-spacing:-.02em}
.amtdisp.empty{color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.keypad button{border:0;background:var(--sunk);border-radius:12px;padding:13px 0;font-size:20px;font-weight:600}
.keypad button:active{background:var(--line)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* toast */
.toast span{pointer-events:none}.toast button{pointer-events:auto}
.toast{pointer-events:none;position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline}
/* misc */
.empty-state{text-align:center;padding:28px 12px;color:var(--muted)}
.dayh{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;padding-top:12px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters .input{padding:8px 10px;font-size:14px}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
tfoot td{font-weight:700;border-bottom:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;background:var(--accent-soft);color:var(--ink)}
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.lock .dots{display:flex;gap:12px}
.lock .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.lock .dots i.on{background:var(--ink)}
.lock .keypad{width:min(300px,100%)}
.privacy{position:fixed;inset:0;z-index:79;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none}
.onb h1{font-size:26px}
.check{display:flex;align-items:center;gap:10px;padding-block:7px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.check .input{width:110px;padding:6px 8px;text-align:right}
.check span{flex:1;min-width:0}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}
html{padding-top:env(safe-area-inset-top,0px)}
/* redesign: fewer boxes, plain sections, ledger rows */
.sect{border-top:1px solid var(--line);padding-block:16px 6px}
.sect h2{font-size:16px}
.sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.hero2{padding-block:6px 4px}
.hero2 .big{font-family:var(--f-display);font-size:clamp(36px,11vw,48px);font-weight:700;letter-spacing:-.025em;line-height:1.05;margin-top:2px}
.hero2 .big.neg{color:var(--bad)}
.heroline{font-size:15px;line-height:1.5;margin:8px 0 14px;max-width:46ch}
.mbar{display:flex;gap:2px;height:12px;border-radius:999px;overflow:hidden;background:var(--sunk)}
.mbar i{display:block;height:100%}
.b-spent{background:var(--ink)}
.b-plan{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,var(--accent-soft) 3px 6px)}
.b-free{background:var(--good)}
.b-short{background:var(--bad)}
.mlegend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 2px;color:var(--muted)}
.mlegend span{display:inline-flex;align-items:center;gap:6px}
.mlegend b{color:var(--ink);font-weight:600}
.mlegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.calm{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:14px;color:var(--muted)}
.calm .dot{margin-top:6px}
.attn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px 6px}
.attn-h{font-family:var(--f-display);font-weight:600;font-size:15px;padding:10px 0 4px}
.attn-item{display:flex;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.attn-item .dot{margin-top:0}
.grow{flex:1;min-width:0}
.cib{width:34px;height:34px;border-radius:10px;background:var(--sunk);color:var(--ink);display:grid;place-items:center;flex:none}
.cib svg{width:18px;height:18px}
.chev{color:var(--muted);flex:none}
.row.done .t,.row.done .amt{color:var(--muted)}
.pbar{position:relative;height:8px;background:var(--sunk);border-radius:999px}
.pbar i{display:block;height:100%;border-radius:999px;max-width:100%}
.pbar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);border-radius:1px}
.pbar.slim{height:5px;margin:8px 0 0 46px}
.brow{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0 12px;color:inherit}
.brow:last-of-type{border-bottom:0}
button.brow:hover{background:var(--sunk)}
.brow-top{display:flex;align-items:center;gap:12px}
.brow-top .n{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow-top .v{text-align:right;white-space:nowrap}
.bsum{padding-block:2px 6px}
.bedit-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.erow{display:flex;align-items:center;gap:12px;padding-block:9px;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .n{flex:1;min-width:0;font-weight:500;display:flex;flex-direction:column}
.erow .rs{display:flex;align-items:center;gap:4px;color:var(--muted)}
.erow .input{width:118px;text-align:right;padding:8px 10px}
.dayh{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:16px 0 4px;border-bottom:1px solid var(--line)}
.dayh .num{text-transform:none;letter-spacing:0;font-weight:600}
.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swipe:last-child{border-bottom:0}
.swipe .row{border-bottom:0}
.swipe-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.swipe.to-del .swipe-bg{background:var(--bad-soft);color:var(--bad)}
.swipe.to-del .sw-edit,.swipe:not(.to-del) .sw-del{visibility:hidden}
.swipe-fg{position:relative;display:block;background:var(--bg);transition:transform .18s ease-out;touch-action:pan-y}
.filters .input{background:var(--surface)}
.qrep{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin:0 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{white-space:nowrap;flex:none}
.chip.ghost{background:transparent;border-style:dashed}
.qtype{flex:1;max-width:330px}
.amtdisp.is-in{color:var(--good)}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:none;padding:12px 2px;font-size:14px;color:var(--ink);text-align:left}
.qmeta span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmeta[aria-expanded="true"] .chev{transform:rotate(90deg)}
.qdetails{padding-top:12px}
.seg.scroll{overflow-x:auto;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll button{flex:none;padding:7px 12px;white-space:nowrap}
.qtype button{padding:7px 8px;font-size:13px;white-space:nowrap}
.insight{margin:0;font-size:14px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft)}
.insight.good{background:var(--good-soft)}
.splitbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}

/* ===== Foundations ==========================================================
   Sources: Apple HIG (44pt touch targets, 17pt body), Material 3 (48dp targets, 4/8dp grid),
   web.dev Core Web Vitals (no layout shift), WCAG 2.2 (2.5.8 target size, 1.4.4 resize text).
   Spacing scale 4·8·12·16·24·32  ·  Type scale 12·13·14·16·20·24·32·44                     */
:root{--sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;--sp6:32px;--tap:44px;--r:14px;--r-sm:10px;
  --t-cap:12px;--t-sm:13px;--t-md:14px;--t-body:16px;--t-lg:20px;--t-xl:24px;--t-2xl:32px;--t-hero:44px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:auto}
html,body{overscroll-behavior:none}                      /* no rubber-band drag on iPhone */
body{font-size:var(--t-body);line-height:1.5;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

input,select,textarea,.input,.filters .input,.srow .input,.tsel,.rolesel,.erow .input,.check .input{font-size:16px!important}
.small{font-size:var(--t-sm)}
.label{font-size:var(--t-cap)}
h1{font-size:var(--t-lg)}
.topbar{min-height:60px;padding-block:var(--sp2)}
.topbar h1{font-size:var(--t-lg)}
/* touch targets */
.btn{min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:var(--sp2)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:var(--t-md)}
.btn.block{min-height:50px}
.mswitch{padding:2px}
.mswitch button{width:40px;height:40px}
.x{width:40px;height:40px;flex:none}
.x.sm{width:38px!important;height:38px!important}
.chip{min-height:40px;padding:8px 14px}
.seg button{min-height:40px}
.link{min-height:36px;display:inline-flex;align-items:center}
p .link,.small a,p a{min-height:0;display:inline}
.tabs a{min-height:56px;justify-content:center}
.keypad button{min-height:52px}
.row{min-height:56px}
/* sheets sit above the keyboard and never scroll the page behind them */
.scrim{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);bottom:auto}
.sheet{max-height:calc(var(--vvh,100dvh) - 24px);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* with the keyboard up, hide the bottom bar and + so they don't float mid-screen */
body.kb .tabs,body.kb .fab{display:none!important}
.app{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

.rowacts+.row,.sect .row:has(+.rowacts){border-bottom:0}

<body>

<div class="app" id="app"><div class="empty-state" style="padding-top:30vh">Loading your budget…</div></div>
<div class="tabs" id="tabs" hidden></div>
<button class="fab" id="fab" aria-label="Add expense or income" hidden>+</button>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<div id="lockRoot"></div>

<script>
"use strict";
/* ================= constants ================= */
const SECTIONS=[
  {k:'income',n:'Income'},{k:'savings',n:'Savings & Investments'},{k:'bills',n:'Bills'},
  {k:'expenses',n:'Expenses'},{k:'debt',n:'Debt / EMIs'}];
const SECN=Object.fromEntries(SECTIONS.map(s=>[s.k,s.n]));
const OUT=['savings','bills','expenses','debt'];
const MODES=['UPI','Card','Cash','Net banking','Auto-debit'];
const COLS=['settings','cats','tx','months','bills','loans','cards','goals','log','accounts','recurring','assets','trash'];
const ROUTES=['home','transactions','budget','plan','more','family','bills','reports','prefs','pushsetup','help','habits'];

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INR=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
function fmt(p,o={}){const v=Math.round((p||0)/100);const s=INR.format(Math.abs(v));if(v<0)return '−₹'+s;return (o.plus&&v>0?'+':'')+'₹'+s}
function fmtShort(p){const v=Math.abs((p||0)/100);let s;if(v>=1e7)s=(v/1e7).toFixed(v>=1e8?0:1)+'Cr';else if(v>=1e5)s=(v/1e5).toFixed(v>=1e6?0:1)+'L';else if(v>=1e3)s=(v/1e3).toFixed(v>=1e4?0:1)+'k';else s=String(Math.round(v));return (p<0?'−':'')+'₹'+s.replace('.0','')}
function parseAmt(s){if(s==null)return NaN;s=String(s).replace(/[₹,\s]/g,'');if(s==='')return NaN;const n=Number(s);return isFinite(n)?Math.round(n*100):NaN}
const rupees=p=>p==null?'':String(Math.round(p)/100);
const pad=n=>String(n).padStart(2,'0');
const dim=(y,m)=>new Date(y,m,0).getDate();
const ym=(y,m)=>y+'-'+pad(m);
function addM(key,n){let[y,m]=key.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return ym(y,m)}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const todayISO=()=>iso(new Date());
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function mLabel(k){const[y,m]=k.split('-').map(Number);return MON[m-1]+' '+y}
function mLong(k){const[y,m]=k.split('-').map(Number);return MONL[m-1]}
function dLabel(ds){const[y,m,d]=ds.split('-').map(Number);const dt=new Date(y,m-1,d);return dt.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}
function dShort(ds){const[y,m,d]=ds.split('-').map(Number);return d+' '+MON[m-1]}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
function addDays(ds,n){const d=new Date(ds+'T00:00');d.setDate(d.getDate()+n);return iso(d)}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

/* ================= store ================= */
const D={};COLS.forEach(c=>D[c]={});
let ME=null,MODE='loading',ROLE='Owner',IS_OWNER=true;
let stale=false;
const NAMES={};
const queues={};
function enqueue(path,fn){const p=(queues[path]||Promise.resolve()).then(fn,fn);queues[path]=p.catch(()=>{});return p}
function writeErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument')toast("Your role can't change this. Ask the family Owner or an Admin.");
  else if(c==='server'&&/docs_col_check/.test(e.message||''))toast('The database needs a one-time update for this. Owner: run supabase/v2.sql in Supabase.');
  else if(c==='server')toast(e.message||"Couldn't save.");
  else if(c==='quota_exceeded')toast('Storage is full. Delete old entries to add new ones.');
  else if(c==='revoked')toast('Your access to this budget was removed.');
  else toast("Couldn't save. Check your connection and try again.");
}
// set one field inside a record (path of keys); null removes it
function setDeep(o,path,v){const r=o&&typeof o==='object'?o:{};let cur=r;for(let i=0;i<path.length-1;i++){const k=path[i];if(!cur[k]||typeof cur[k]!=='object')cur[k]={};cur=cur[k]}const last=path[path.length-1];if(v==null)delete cur[last];else cur[last]=v;return r}
const store={
  // one field of a shared record (a month's budgets, bill marks, card statements): family edits merge instead of overwriting each other
  patch(col,id,path,value){
    const next=setDeep(D[col][id]?JSON.parse(JSON.stringify(D[col][id])):{},path,value);
    if(MODE==='local'){D[col]={...D[col],[id]:next};saveLocal();changed();return Promise.resolve()}
    D[col]={...D[col],[id]:next};cacheSoon();changed();
    return cloudPatch({col,id,path,value:value==null?null:value,patch:true}).catch(e=>{writeErr(e);throw e});
  },
  set(col,id,obj){
    if(MODE==='local'){D[col]={...D[col],[id]:obj};saveLocal();changed();return Promise.resolve()}
    if(MODE==='cloud'){D[col]={...D[col],[id]:obj};cacheSoon();changed();return cloudWrite({col,id,data:obj,deleted:false}).catch(e=>{writeErr(e);throw e})}
  },
  del(col,id){
    if(MODE==='local'){const n={...D[col]};delete n[id];D[col]=n;saveLocal();changed();return Promise.resolve()}
    if(MODE==='cloud'){const n={...D[col]};delete n[id];D[col]=n;cacheSoon();changed();return cloudWrite({col,id,data:null,deleted:true}).catch(e=>{writeErr(e);throw e})}
  }
};
function saveLocal(){try{localStorage.setItem('paisa-local',JSON.stringify(D))}catch(e){toast('This device is out of storage for the app. Back up, then delete old entries.')}}
function log(action,entity,detail){
  const id=uid();
  store.set('log',id,{at:Date.now(),user:ME||'local',action,entity,detail:String(detail||'').slice(0,160)}).catch(()=>{});
}

/* ================= calculations (single source of truth) ================= */
let memo={};
function changed(){memo={};scheduleRender()}
const S=()=>D.settings.main||null;
const sd=()=>(S()&&S().startDay)||1;
function keyOf(ds){const[y,m,d]=ds.split('-').map(Number);const s=Math.min(sd(),dim(y,m));return d<s?addM(ym(y,m),-1):ym(y,m)}
function mStart(k){const[y,m]=k.split('-').map(Number);return ym(y,m)+'-'+pad(Math.min(sd(),dim(y,m)))}
function mEnd(k){return addDays(mStart(addM(k,1)),-1)}
const curKey=()=>keyOf(todayISO());
function catsAll(){
  if(memo.cats)return memo.cats;
  const order=Object.fromEntries(SECTIONS.map((s,i)=>[s.k,i]));
  return memo.cats=Object.entries(D.cats).map(([id,c])=>({...c,id})).sort((a,b)=>(order[a.section]-order[b.section])||((a.order||0)-(b.order||0))||a.name.localeCompare(b.name));
}
const catById=id=>D.cats[id]?{...D.cats[id],id}:null;
function txIndex(){
  if(memo.ti)return memo.ti;
  const ti={};
  for(const[id,t]of Object.entries(D.tx)){
    if(!t||!t.date)continue;
    const k=keyOf(t.date);const e=ti[k]||(ti[k]={list:[],byCat:{}});
    e.list.push({...t,id});e.byCat[t.cat]=(e.byCat[t.cat]||0)+(t.amt||0);
  }
  for(const k in ti)ti[k].list.sort((a,b)=>b.date.localeCompare(a.date)||(b.at||0)-(a.at||0));
  return memo.ti=ti;
}
function budgetOf(c,k){
  const ov=D.months[k]&&D.months[k].b&&D.months[k].b[c.id];
  if(ov!=null)return ov;
  const h=(c.hist||[]).slice().sort((a,b)=>a.from.localeCompare(b.from));
  let v=h.length?h[0].amt:0;
  for(const e of h)if(e.from<=k)v=e.amt;
  return v;
}
function opening(k){
  const s=S();if(!s)return 0;
  const ov=D.months[k]&&D.months[k].open;
  if(ov!=null)return ov;
  if(k<s.startMonth)return 0;
  if(k===s.startMonth)return s.opening||0;
  return month(addM(k,-1)).close;
}
// A card bill is a category linked to a card (cat.card). Older budgets with no links fall back to the name, once.
function cardLinks(){if(memo.cl)return memo.cl;const m={};Object.entries(D.cats).forEach(([id,c])=>{if(c&&c.card)m[id]=c.card});return memo.cl=m}
function cardOfCat(c){if(!c)return null;if(c.card)return D.cards[c.card]?c.card:null;return !Object.keys(cardLinks()).length&&/credit card/i.test(c.name||'')?'*':null}
const isCardBill=c=>!!cardOfCat(c);
// money moved to the card(s) a bill category pays, in a list of entries
function paidToCard(c,list){const k=cardOfCat(c);if(!k)return 0;return list.filter(x=>x.type==='xfer'&&String(x.to||'').startsWith('card:')&&(k==='*'||x.to==='card:'+k)).reduce((s,x)=>s+x.amt,0)}
function month(k){
  memo.m=memo.m||{};
  if(memo.m[k])return memo.m[k];
  // compute earlier months iteratively first (avoids deep recursion)
  const s=S();
  if(s&&k>s.startMonth&&!memo.m[addM(k,-1)]){let p=s.startMonth;while(p<k){month(p);p=addM(p,1)}}
  const ti=txIndex()[k]||{list:[],byCat:{}};
  const cats=catsAll().filter(c=>!c.archived||ti.byCat[c.id]).map(c=>{
    const budget=budgetOf(c,k),actual=ti.byCat[c.id]||0;
    return{...c,budget,actual,left:budget-actual};
  });
  const sec={};SECTIONS.forEach(x=>sec[x.k]={b:0,a:0});
  cats.forEach(c=>{if(sec[c.section]){sec[c.section].b+=c.budget;sec[c.section].a+=c.actual}});
  const open=opening(k);
  const income=sec.income.a;
  const spent=OUT.reduce((t,x)=>t+sec[x].a,0);
  const planned=OUT.reduce((t,x)=>t+sec[x].b,0);
  const close=open+income-spent;
  // still to pay = budget not yet used on outflow categories
  // a card bill already paid by transfer to its card isn't still to pay (the purchases are counted as spent)
  const toPay=cats.filter(c=>OUT.includes(c.section)).reduce((t,c)=>t+Math.max(0,isCardBill(c)?c.left-paidToCard(c,ti.list):c.left),0);
  const incomeToCome=Math.max(0,sec.income.b-sec.income.a);
  return memo.m[k]={key:k,cats,sec,open,income,spent,planned,close,toPay,incomeToCome,list:ti.list,
    available:open+income,left:open+income-spent,projected:open+income+incomeToCome-spent-toPay};
}
function dueDate(c,k){
  const[y,m]=k.split('-').map(Number);const d=c.dueDay;
  if(sd()===1||d>=sd())return ym(y,m)+'-'+pad(Math.min(d,dim(y,m)));
  const n=addM(k,1);const[y2,m2]=n.split('-').map(Number);return n+'-'+pad(Math.min(d,dim(y2,m2)));
}
function billsFor(k){
  const m=month(k),t=todayISO(),skip=(D.bills[k]&&D.bills[k].skip)||{};
  return m.cats.filter(c=>(c.section==='bills'||c.section==='debt')&&c.dueDay&&!c.archived).map(c=>{
    const due=dueDate(c,k);let st,label;
    const viaCard=paidToCard(c,m.list);
    if(c.actual>0||viaCard>0){st='paid';label='Paid';if(!c.actual)return{...c,actual:viaCard,due,st,label}}
    else if(skip[c.id]){st='skip';label='Skipped'}
    else{const dd=daysBetween(t,due);
      if(dd<0){st='overdue';label='Overdue '+(-dd)+'d'}
      else if(dd===0){st='due';label='Due today'}
      else if(dd<=3){st='due';label='Due in '+dd+'d'}
      else{st='up';label='Upcoming'}}
    return{...c,due,st,label};
  }).sort((a,b)=>a.due.localeCompare(b.due));
}
function loanCalc(P,annual,E){
  const i=annual/100/12;
  if(P<=0)return{n:0,interest:0};
  if(E<=0)return{err:'Add the EMI amount'};
  if(i===0){const n=Math.ceil(P/E);return{n,interest:Math.max(0,E*n-P)}}
  if(E<=i*P)return{err:'EMI too low to repay'};
  const n=Math.ceil(-Math.log(1-i*P/E)/Math.log(1+i));
  return{n,interest:Math.max(0,E*n-P)};
}
function loanOutstanding(l){
  // each EMI recorded after the "as of" date reduces the estimate
  let P=l.outstanding||0;const i=(l.rate||0)/100/12;
  if(!l.cat)return P;
  const paid=Object.values(D.tx).filter(t=>t.cat===l.cat&&t.date>(l.asOf||'')).length;
  for(let n=0;n<paid&&P>0;n++)P=Math.max(0,P-Math.max(0,(l.emi||0)-Math.round(P*i)));
  return P;
}
function cardStatus(st){if(!st||!st.amt)return null;const p=st.paid||0;if(p>=st.amt)return'full';if(p>0)return'part';return'none'}
function goalCalc(g){
  const prog=g.target>0?clamp((g.saved||0)/g.target,0,1):0;
  const rem=Math.max(0,(g.target||0)-(g.saved||0));
  const n=rem===0?0:(g.monthly>0?Math.ceil(rem/g.monthly):Infinity);
  let on=null;
  if(g.date&&isFinite(n)){on=addM(curKey(),n)<=g.date.slice(0,7)}else if(g.date)on=false;
  return{prog,n,on};
}
function chainKeys(){const s=S();if(!s)return[];const out=[];let k=s.startMonth;const last=[curKey(),...Object.keys(txIndex())].sort().pop();while(k<=last&&out.length<240){out.push(k);k=addM(k,1)}return out}

/* ================= permissions ================= */
const canWrite=()=>ROLE!=='Viewer';
const canAdmin=()=>ROLE==='Owner'||ROLE==='Admin';
const canEditTx=t=>canAdmin()||(ROLE==='Member'&&t.by===ME);
const who=id=>!id||id==='local'?'You':(id===ME?'You':(NAMES[id]||(MODE==='cloud'?'Former member':'Family member')));

/* ================= view state ================= */
let VM=null; // viewed month key
let route='home';
let planTab='accounts';

// Category guess: remembered merchant first, then what the user usually logs at this amount and time of day.
function merchantMemory(){
  if(memo.merch)return memo.merch;const mm={};
  Object.values(D.tx).sort((a,b)=>(a.at||0)-(b.at||0)).forEach(t=>{const n=(t.note||'').trim();if(n&&D.cats[t.cat]&&!D.cats[t.cat].archived)mm[n.toLowerCase()]={cat:t.cat,note:n,mode:t.mode,card:t.card||''}});
  return memo.merch=mm;
}
function guessCat(amt,note){
  if(note){const m=merchantMemory()[note.trim().toLowerCase()];if(m)return m.cat}
  if(!(amt>0))return null;
  const hr=new Date().getHours();const since=Date.now()-120*864e5;const score={};
  Object.values(D.tx).forEach(t=>{const c=D.cats[t.cat];if(!c||c.archived||c.section==='income'||(t.at||0)<since||t.src==='import')return;
    const r=t.amt/amt;if(r<.6||r>1.6)return;const th=new Date(t.at).getHours();const dh=Math.min(Math.abs(th-hr),24-Math.abs(th-hr));
    score[t.cat]=(score[t.cat]||0)+(dh<=2?2:1)+(r>.85&&r<1.15?1:0)});
  let best=null,bs=2;for(const k in score)if(score[k]>bs){bs=score[k];best=k}
  return best;
}

  return `${fmt(Math.floor(m.projected/days/100)*100)} a day left for ${days} day${days===1?'':'s'}.`;
}

  if(canAdmin()&&noDue.length)steps.push({k:'due',t:`Add due dates for ${noDue.length===1?esc(noDue[0].name):noDue.length+' bills and EMIs'} so nothing slips.`,b:'Add dates',a:'duedates',meta:'30 sec'});
  if(NOTIF_SUPPORT&&Notification.permission==='default')steps.push({k:'notif',t:'Get a heads-up 3 days before each bill is due.',b:'Turn on',a:'allownotif'});
  const loanCat=catsAll().find(c=>!c.archived&&c.section==='debt'&&LOANLIKE.test(c.name)&&!isCardBill(c)&&!Object.values(D.loans).some(l=>l.cat===c.id));
  if(canAdmin()&&loanCat)steps.push({k:'loan-'+loanCat.id,t:`See the date your ${esc(loanCat.name.replace(/\s*EMI$/i,''))} ends.`,b:'Show me',a:'loanask',id:loanCat.id});
  const hh=S()&&S().household;
  if(MODE==='cloud'&&canAdmin()&&hh&&hh!=='me'&&MEMBERS.length<2)steps.push({k:'invite',t:`Invite ${hh==='partner'?'your partner':'your family'} so their spends count too.`,b:'Invite',a:'goinvite'});
  // three months of savings in a row, no goal yet
  const last3=[1,2,3].map(i=>addM(k,-i)).filter(x=>txIndex()[x]);
  if(canAdmin()&&last3.length===3&&!Object.keys(D.goals).length){const tot=last3.reduce((t,x)=>t+month(x).sec.savings.a,0);if(last3.every(x=>month(x).sec.savings.a>0))steps.push({k:'goal',t:`You've saved ${fmt(tot)} since ${mLong(last3[2])}. Give it a goal?`,b:'Make a goal',a:'editgoal'})}
  return steps.find(s=>!snoozed(s.k))||null;
}

function draftBudget(c){const v=BDRAFT[c.id];if(v==null)return c.budget;const p=parseAmt(v);return isNaN(p)?0:p}
function bsumHTML(m){
  const inc=m.cats.filter(c=>c.section==='income'&&!c.archived).reduce((t,c)=>t+draftBudget(c),0);
  const out=m.cats.filter(c=>OUT.includes(c.section)&&!c.archived).reduce((t,c)=>t+draftBudget(c),0);
  const diff=m.open+inc-out;
  return `Income <b class="num">${fmt(inc)}</b> · Planned out <b class="num">${fmt(out)}</b><br>${diff>=0?`<span style="color:var(--good)">Leaves <b class="num">${fmt(diff)}</b> unplanned, including the opening balance.</span>`:`<span class="over">Plans <b class="num">${fmt(-diff)}</b> more than you'll have.</span>`}`;
}
function histWith(c,old,amt,k){
  let h=(c.hist||[]).filter(x=>x.from<k);
  if(!h.length){const prev=(c.hist||[]).slice().sort((a,b)=>a.from.localeCompare(b.from));if(prev.length&&prev[0].from<k)h.push({from:prev[0].from,amt:old})}
  h.push({from:k,amt});return h;
}
async function saveBudgets(){
  const mdoc=JSON.parse(JSON.stringify(D.months[VM]||{}));let mChanged=false,n=0;const writes=[];
  for(const id of Object.keys(BDRAFT)){
    const amt=parseAmt(BDRAFT[id]);if(isNaN(amt)||!D.cats[id])continue;
    const c={...D.cats[id]};const old=budgetOf({...c,id},VM);
    if(amt===old&&!(BSCOPE==='future'&&mdoc.b&&mdoc.b[id]!=null))continue;
    n++;
    if(BSCOPE==='month')writes.push(store.patch('months',VM,['b',id],amt));
    else{c.hist=histWith(c,old,amt,VM);writes.push(store.set('cats',id,c));if(mdoc.b&&mdoc.b[id]!=null)writes.push(store.patch('months',VM,['b',id],null))}
  }
  BEDIT=false;BDRAFT={};render();
  if(!n){toast('No budgets changed.');return}
  await Promise.allSettled(writes);
  log('changed','budgets',`${n} categor${n===1?'y':'ies'} (${BSCOPE==='month'?mLabel(VM)+' only':'from '+mLabel(VM)})`);
  toast(`Updated ${n} budget${n===1?'':'s'}.`);
}

function parseQuick(s){

  const m=s.match(/(?:₹|rs\.?\s*)?(\d[\d,]*(?:\.\d{1,2})?)\s*(k|l|lakh|lac)?\b/i);const out={};
  if(m){let v=parseFloat(m[1].replace(/,/g,''));const u=(m[2]||'').toLowerCase();if(u==='k')v*=1e3;else if(u)v*=1e5;out.amt=String(Math.round(v*100)/100);s=(s.slice(0,m.index)+' '+s.slice(m.index+m[0].length)).trim()}
  s=s.replace(/^(on|for|at|to)\s+/i,'').replace(/\s+/g,' ').trim();

  }

}

let IMP=null;
function secFrom(s){s=String(s||'').toLowerCase();if(s.startsWith('inc'))return'income';if(s.startsWith('sav')||s.includes('invest'))return'savings';if(s.startsWith('bill'))return'bills';if(s.startsWith('debt')||s.includes('emi')||s.includes('loan'))return'debt';if(s.startsWith('exp'))return'expenses';return null}
function toISO(v){
  if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getTime()+12*36e5));
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  const s=String(v||'').trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/)){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad(m[2])+'-'+pad(m[1])}
  const d=new Date(s);return isNaN(d)?null:iso(d);
}
async function handleImport(file){
  let X;try{X=await loadXLSX()}catch(e){toast("Couldn't load the Excel library. Check your connection.");return}
  let wb;try{wb=X.read(await file.arrayBuffer(),{cellDates:true})}catch(e){toast("Couldn't read that file. Save it as .xlsx and try again.");return}
  const find=re=>wb.SheetNames.find(n=>re.test(n));
  const rowsOf=n=>n?X.utils.sheet_to_json(wb.Sheets[n],{defval:''}):[];
  const col=(r,...names)=>{for(const k of Object.keys(r)){const kl=k.toLowerCase().trim();if(names.some(n=>kl===n||kl.startsWith(n)))return r[k]}return''};
  const bName=find(/budget|categor/i);const lName=find(/expense log|log|transaction|entries/i)||(wb.SheetNames.length===1?wb.SheetNames[0]:null);
  const existing={};catsAll().forEach(c=>existing[c.name.toLowerCase()]=c);
  const newCats={};const budgetRows=[];
  rowsOf(bName).forEach(r=>{const name=String(col(r,'category','name')).trim();if(!name)return;const sec=secFrom(col(r,'section','type'))||guessSection(name);const b=parseAmt(col(r,'budget','planned','amount'));const due=parseInt(col(r,'due'),10);
    budgetRows.push({name,sec,b:isNaN(b)?0:b,due:due>=1&&due<=31?due:null});
    if(!existing[name.toLowerCase()])newCats[name.toLowerCase()]={name,sec,b:isNaN(b)?0:b,due:due>=1&&due<=31?due:null}});
  const tx=[];let skipped=0;
  rowsOf(lName===bName?null:lName).forEach(r=>{const date=toISO(col(r,'date'));const name=String(col(r,'category')).trim();const amt=parseAmt(col(r,'amount','actual','spent'));
    if(!date||!name||!(amt>0)){skipped++;return}
    const sec=secFrom(col(r,'section','type'));
    if(!existing[name.toLowerCase()]&&!newCats[name.toLowerCase()])newCats[name.toLowerCase()]={name,sec:sec||guessSection(name),b:0,due:null};
    const mode=MODES.find(m=>m.toLowerCase()===String(col(r,'mode','payment')).toLowerCase().trim())||(String(col(r,'mode','payment')).toLowerCase().includes('card')?'Card':'UPI');
    const an=String(col(r,'account','bank')).toLowerCase().trim();const ma=an?acctList().find(a=>(a.last4&&an.includes(a.last4))||(a.nick&&an.includes(a.nick.toLowerCase()))||an.includes((a.bank||'').toLowerCase())):null;
    tx.push({date,name,amt,mode,note:String(col(r,'note','description','remarks')).slice(0,120),acct:ma?ma.id:''})});
  if(!tx.length&&!budgetRows.length){toast('No Budget or Expense Log rows found. Use the template’s column names.');return}
  tx.forEach(t=>t.k=keyOf(t.date));
  const months=[...new Set(tx.map(t=>t.k))].sort();
  const knownCount=new Set(tx.map(t=>t.name.toLowerCase()).filter(n=>existing[n])).size;
  IMP={tx,newCats,budgetRows,skipped,months,knownCount,skip:{},step:0};
  openImportStep();

function loanGoalCalc(g){
  const l=D.loans[g.loan];if(!l)return null;
  const P=loanOutstanding(l),i=(l.rate||0)/100/12,E=l.emi||0;
  const now=loanCalc(P,l.rate||0,E);
  const prog=l.original?clamp(1-P/l.original,0,1):0;
  if(!g.date)return{l,P,prog,now};
  const n=Math.max(1,(()=>{const[y,m]=g.date.slice(0,7).split('-').map(Number);const[cy,cm]=curKey().split('-').map(Number);return(y-cy)*12+(m-cm)})());
  // EMI needed to finish by the target month
  const need=i===0?Math.ceil(P/n):Math.ceil(P*i/(1-Math.pow(1+i,-n)));
  const on=!now.err&&now.n<=n;
  return{l,P,prog,now,n,need,extra:Math.max(0,need-E),on};
}

// Pace: projects a category's month-end total from how fast it's being spent.
// Plan check: is more planned to go out than the month brings in?
function planGap(k){
  const m=month(k);const inc=m.cats.filter(c=>c.section==='income'&&!c.archived).reduce((t,c)=>t+c.budget,0);
  const out=m.cats.filter(c=>OUT.includes(c.section)&&!c.archived).reduce((t,c)=>t+c.budget,0);
  return{inc,out,gap:out-(m.open+inc)};
}
function planBannerHTML(k){
  const p=planGap(k);if(p.gap<=0)return'';
  return `<div class="planwarn"><div class="grow small"><b>Your plan is ${fmt(p.gap)} more than you'll have</b> in ${mLong(k)}. Planned out ${fmt(p.out)}, income ${fmt(p.inc)}${month(k).open?` plus ${fmt(month(k).open)} to start`:''}.</div>${canAdmin()?'<button class="btn sm" data-act="bedit">Trim the plan</button>':''}</div>`;
}

  billsHour:RH('paisa-h-bills',8),eveningHour:RH('paisa-h-eve',21),weeklyHour:RH('paisa-h-week',19),weeklyDay:(()=>{const v=parseInt(lsGet('paisa-d-week'),10);return v>=0&&v<=6?v:0})()});

const b64uToBytes=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const bytesToB64u=b=>btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
let PUSH_ON=null;
async function syncPush(){
  if(!PUSH_READY()||!SB||!ME||!NOTIF_SUPPORT||Notification.permission!=='granted')return false;
  try{
    const reg=await navigator.serviceWorker.ready;const p=pushPrefs();
    let sub=await reg.pushManager.getSubscription();
    if(!p.bills&&!p.evening&&!p.weekly){if(sub){await SB.rpc('delete_push_subscription',{p_endpoint:sub.endpoint});await sub.unsubscribe()}PUSH_ON=false;return true}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(CFG.vapidPublicKey)});
    const j=sub.toJSON();const {error}=await SB.rpc('save_push_subscription',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_prefs:p});
    PUSH_ON=!error;return PUSH_ON;
  }catch(e){PUSH_ON=false;return false}
}

let PS={keys:null,secret:null,sql:'',fn:''};
async function psGenerate(){
  const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  const jwk=await crypto.subtle.exportKey('jwk',kp.privateKey);
  const pub=new Uint8Array([4,...b64uToBytes(jwk.x),...b64uToBytes(jwk.y)]);
  PS.keys={pub:bytesToB64u(pub),priv:jwk.d};
  PS.secret=[...crypto.getRandomValues(new Uint8Array(24))].map(b=>b.toString(16).padStart(2,'0')).join('');
  render();
}
function cronSQL(){
  const url=(CFG.supabaseUrl||'https://YOUR-PROJECT.supabase.co').replace(/\/$/,'')+'/functions/v1/send-reminders';
  const sec=PS.secret||'PASTE-YOUR-CRON-SECRET';
  const job=(name,cron,kind)=>`select cron.schedule('${name}', '${cron}', $job$
  select net.http_post(
    url := '${url}',
    headers := jsonb_build_object('Content-Type','application/json','x-cron-secret','${sec}'),
    body := jsonb_build_object('kind','${kind}'))
$job$);`;
  return `-- Paisa Planner reminder schedule: runs at the top of every hour (India time);
-- each person gets reminders at the times they picked in Settings → Reminders.
create extension if not exists pg_cron;
create extension if not exists pg_net;
select cron.unschedule(jobname) from cron.job where jobname like 'paisa-%';
${job('paisa-hourly','30 * * * *','auto')}`;
}

// balance = what was there on the "as of" day + adjustments from balance checks + every entry since
function acctBalance(id){
  memo.bal=memo.bal||{};if(memo.bal[id]!=null)return memo.bal[id];
  const a=D.accounts[id];if(!a)return 0;let b=(a.opening||0)+(a.adj||0);const since=a.asOf||'0000-00-00';
  for(const t of Object.values(D.tx)){
    if(!t||t.date<since)continue;
    if(t.date===since&&a.createdAt&&(t.at||0)<a.createdAt)continue;
    if(isXfer(t)){if(t.to===id)b+=t.amt;if(t.from===id)b-=t.amt;continue}
    if(t.acct!==id||t.mode==='Card')continue;
    const c=D.cats[t.cat];if(!c)continue;b+=c.section==='income'?t.amt:-t.amt;
  }
  return memo.bal[id]=b;
}

function acctBalanceAt(id,date){
  const a=D.accounts[id];if(!a)return 0;if(a.asOf&&date<a.asOf)return null;let b=(a.opening||0)+(a.checkedAt&&a.checkedAt<date?(a.adj||0):0);const since=a.asOf||'0000-00-00';
  for(const t of Object.values(D.tx)){if(!t||t.date<since||t.date>=date)continue;if(t.date===since&&a.createdAt&&(t.at||0)<a.createdAt)continue;
    if(isXfer(t)){if(t.to===id)b+=t.amt;if(t.from===id)b-=t.amt;continue}
    if(t.acct!==id||t.mode==='Card')continue;const c=D.cats[t.cat];if(!c)continue;b+=c.section==='income'?t.amt:-t.amt}
  return b;
}

/* ---- share an SMS or payment message to Paisa (Android) ---- */
const SHARED=(()=>{try{const q=new URLSearchParams(location.search);const t=[q.get('title'),q.get('text'),q.get('url')].filter(Boolean).join(' ').trim();return t||null}catch(e){return null}})();
function parseShared(s){
  const out={};const txt=s.replace(/\s+/g,' ');
  const m=txt.match(/(?:₹|rs\.?|inr)\s*([\d,]+(?:\.\d{1,2})?)/i)||txt.match(/(?:debited|credited|paid|sent|received|spent)\s+(?:by|with|for|of)?\s*([\d,]+(?:\.\d{1,2})?)/i);
  if(m)out.amt=String(parseFloat(m[1].replace(/,/g,'')));
  if(/credited|received|deposited|refund/i.test(txt)&&!/debited/i.test(txt))out.type='in';else out.type='out';
  const card=txt.match(/card\s*(?:no\.?|ending|xx|\*+)?\s*[x*]*\s*(\d{4})/i);if(card&&out.type==='out'){out.mode='Card';const cid=Object.entries(D.cards).find(([i,c])=>(c.name||'').includes(card[1]));if(cid)out.card=cid[0]}
  const ac=txt.match(/(?:a\/c|acct|account|ac)\s*(?:no\.?)?\s*[x*]*\s*(\d{3,4})/i);if(ac){const a=acctList().find(x=>x.last4&&x.last4.endsWith(ac[1].slice(-4)));if(a)out.acct=a.id}
  const vpa=txt.match(/([a-z0-9._-]{3,})@[a-z]{2,}/i);
  const to=txt.match(/(?:\bto\b|\bat\b|\btowards\b|\bfrom\b)\s+([A-Za-z][A-Za-z0-9&.' -]{1,28}?)(?=\s+(?:on|via|using|ref|upi|for|a\/c|avl|bal)\b|[.,;]|$)/i);
  if(to)out.note=to[1].trim();else if(vpa)out.note=vpa[1].replace(/[._-]+/g,' ').replace(/\d+/g,'').trim();
  if(out.note)out.note=out.note.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()).slice(0,40);
  if(/upi/i.test(txt)&&!out.mode)out.mode='UPI';
  return out;
}
function openShared(){
  if(!SHARED||!S()||!canWrite())return;const p=parseShared(SHARED);
  openQuick({type:p.type,amt:p.amt||'',note:p.note||'',mode:p.mode||(p.type==='in'?'Net banking':'UPI'),card:p.card||'',acct:p.acct||defaultAcct(p.mode),more:!p.amt});

}

/* ---- yearly payments (insurance, school fees, taxes): monthly set-aside ---- */
function yearlyCalc(g){
  const now=curKey();const[cy,cm]=now.split('-').map(Number);let due=ym(cy,g.month||cm);if(due<now)due=ym(cy+1,g.month||cm);
  const[dy,dm]=due.split('-').map(Number);const months=Math.max(1,(dy-cy)*12+(dm-cm));
  const left=Math.max(0,(g.amount||0)-(g.saved||0));return{due,months,monthly:Math.ceil(left/months/100)*100,prog:g.amount?clamp((g.saved||0)/g.amount,0,1):0};
}

/* ---- one insight on Home ---- */
function insightHTML(k){
  if(k!==curKey())return'';const total=daysBetween(mStart(k),mEnd(k))+1,gone=daysBetween(mStart(k),todayISO())+1;if(gone<7)return'';
  const f=gone/total;const prev=[1,2,3].map(i=>addM(k,-i)).filter(x=>txIndex()[x]);if(prev.length<2)return'';
  const m=month(k);let best=null;
  m.cats.filter(c=>c.section==='expenses').forEach(c=>{const avg=prev.reduce((s,x)=>s+((txIndex()[x].byCat[c.id])||0),0)/prev.length;if(avg<100000)return;const proj=c.actual/f;const d=proj/avg-1;if(d>=.3&&proj-avg>=100000&&(!best||d>best.d))best={c,avg,proj,d}});
  if(best&&!dismissed('ins:'+best.c.id,k))return `<div class="insight"><span class="grow"><b>${esc(best.c.name)}</b> is heading ${Math.round(best.d*100)}% above your usual ${fmt(Math.round(best.avg/10000)*10000)}.</span><button class="x sm" data-act="dismsg" data-k="ins:${best.c.id}" aria-label="Hide">×</button></div>`;
  const avgAll=prev.reduce((s,x)=>s+month(x).sec.expenses.a,0)/prev.length;const projAll=m.sec.expenses.a/f;
  if(avgAll>0&&projAll<avgAll*.85&&!dismissed('ins:good',k))return `<div class="insight good"><span class="grow">Everyday spending is ${Math.round((1-projAll/avgAll)*100)}% below your usual. Nice.</span><button class="x sm" data-act="dismsg" data-k="ins:good" aria-label="Hide">×</button></div>`;
  return'';
}

/* ================= messages: one registry for every in-app prompt =================
   Each message: rank (1 act now · 2 to confirm · 3 heads-up), slot, and how it reads:
   title = the fact (subject first, under ~6 words) · detail = amount · when · action = one verb.
   Screens never decide what to show on their own; they ask needsItems() for a ranked list. */
const MSG={
  'bill.overdue':{rank:1,tone:'bad',make:b=>({title:`${b.name} was due ${relDay(b.due)}`,detail:`${fmt(b.budget)} · not marked paid`,act:canWrite()?{a:'paybill',id:b.id,l:'Mark paid'}:null})},
  'month.short': {rank:1,tone:'bad',make:m=>({title:`${fmt(-m.projected)} short this month`,detail:'Once planned payments go out',act:{a:'go',k:'budget',l:'Review'}})},
  'month.over':  {rank:1,tone:'bad',make:m=>({title:`Spent ${fmt(-m.left)} more than you had`,detail:'This month so far',act:{a:'go',k:'transactions',l:'See entries'}})},
  'card.part':   {rank:1,tone:'bad',make:([id,cd,st])=>({title:`${cd.name} bill part-paid`,detail:`Interest on ${fmt(st.amt-(st.paid||0))}`,act:canWrite()?{a:'wpay',id,l:'Pay'}:null})},
  'repeat.due':  {rank:2,tone:'cat',make:r=>({title:r.note||r.c.name,detail:`${r.c.section==='income'?'+':''}${fmt(r.amt)} · ${r.c.section==='income'?'usually arrives':'usually goes out'} ${relDay(r.date)}`,act:canWrite()?{a:'recok',id:r.id,l:'Confirm'}:null,alt:canWrite()?{a:'recskip',id:r.id,l:'Skip'}:null,cat:r.c})},
  'acct.check':  {rank:2,tone:'muted',make:a=>({title:`Does ${acctLabel(a)} show ${fmt(acctBalance(a.id))}?`,detail:'Weekly bank check · keeps left to spend true',act:{a:'checkacct',id:a.id,l:'Check'}})},
  'month.start': {rank:3,tone:'muted',dismiss:'month',make:([bank,open])=>({title:`Your banks say you began with ${fmt(bank)}`,detail:`Paisa has ${fmt(open)} as money at the start`,act:canAdmin()?{a:'useopenbank',l:'Use banks'}:null})},
  'cat.over':    {rank:3,tone:'warn',dismiss:'month',make:c=>({title:`${c.name} is ${fmt(-c.left)} over`,detail:`Budget ${fmt(c.budget)}`,act:canAdmin()?{a:'editcat',id:c.id,l:'Adjust'}:{a:'catentries',id:c.id,l:'See entries'}})},
  'cat.pace':    {rank:3,tone:'warn',dismiss:'month',make:([c,over])=>({title:`${c.name} heading ${fmt(over)} over`,detail:`At this pace · budget ${fmt(c.budget)}`,act:canAdmin()?{a:'editcat',id:c.id,l:'Adjust'}:{a:'catentries',id:c.id,l:'See entries'}})},
  'cat.near':    {rank:3,tone:'warn',dismiss:'month',make:([c,days])=>({title:`${fmt(c.left)} left in ${c.name}`,detail:`For ${days} more day${days===1?'':'s'}`,act:{a:'catentries',id:c.id,l:'See entries'}})},
  'card.limit':  {rank:3,tone:'muted',dismiss:'month',make:([id,cd,pct])=>({title:`${cd.name} at ${pct}% of its limit`,detail:'Under 30% is healthier for your credit score',act:{a:'wdetail',id:'card:'+id,l:'Open'}})}
};
const dismissed=(key,k)=>lsGet('paisa-dis-'+key+'-'+k)==='1';
function needsItems(k){
  const m=month(k),isCur=k===curKey(),out=[];
  const add=(type,data,key)=>{const d=MSG[type];if(d.dismiss&&dismissed(key,k))return;out.push({type,key,rank:d.rank,tone:d.tone,dismiss:!!d.dismiss,...d.make(data)})};
  billsFor(k).filter(b=>b.st==='overdue').forEach(b=>add('bill.overdue',b,'bill.overdue:'+b.id));
  if(isCur&&m.projected<0)add('month.short',m,'month.short');
  else if(m.left<0&&!(isCur&&m.incomeToCome>0))add('month.over',m,'month.over');
  Object.entries(D.cards).forEach(([id,cd])=>{const st=cd.stmts&&cd.stmts[k];if(cardStatus(st)==='part')add('card.part',[id,cd,st],'card.part:'+id);
    if(st&&cd.limit&&st.amt/cd.limit>.3)add('card.limit',[id,cd,Math.round(st.amt/cd.limit*100)],'card.limit:'+id)});
  recDue(k).forEach(r=>add('repeat.due',r,'repeat.due:'+r.id));
  if(isCur&&canAdmin()){const due=acctList().filter(a=>!a.checkedAt||daysBetween(a.checkedAt,todayISO())>=7).sort((x,y)=>(x.checkedAt||'').localeCompare(y.checkedAt||''))[0];if(due)add('acct.check',due,'acct.check:'+due.id);
    const bs=bankStart(k);if(bs!=null&&Math.abs(bs-m.open)>=50000&&!(D.months[k]&&D.months[k].open!=null))add('month.start',[bs,m.open],'month.start')}
  m.cats.filter(c=>OUT.includes(c.section)&&c.budget>0&&c.left<0).sort((a,b)=>a.left-b.left).forEach(c=>add('cat.over',c,'cat.over:'+c.id));
  if(isCur){const total=daysBetween(mStart(k),mEnd(k))+1,gone=daysBetween(mStart(k),todayISO())+1,f=clamp(gone/total,0,1),left=total-gone;
    if(f<.92)m.cats.filter(c=>c.section==='expenses'&&c.budget>0&&c.actual>0&&c.left>=0).forEach(c=>{const used=c.actual/c.budget;
      if(used>=.6&&used>f+.15){const proj=Math.round(c.actual/f);if(proj>c.budget){add('cat.pace',[c,Math.round((proj-c.budget)/10000)*10000],'cat.pace:'+c.id);return}}
      if(used>=.8)add('cat.near',[c,left],'cat.near:'+c.id)})}
  return out.sort((a,b)=>a.rank-b.rank);
}
// kept for older callers (Home badge, tests)
function attentionItems(k){return needsItems(k)}
function attentionHTML(k,skip){
  const items=needsItems(k).filter(i=>i.key!==skip);
  if(!items.length)return `<p class="calm"><span class="dot" style="color:var(--good)"></span>Nothing needs you. Bills and budgets are on track.</p>`;
  const shown=ATT_ALL?items:items.slice(0,3);
  const lead=i=>i.cat?icon(i.cat):`<span class="dot" style="color:var(--${i.tone==='bad'?'bad':i.tone==='warn'?'warn':'muted'})"></span>`;
  return `<section class="attn" aria-label="Needs you"><div class="attn-h">Needs you · ${items.length}</div>
    ${shown.map(i=>`<div class="attn-item">${lead(i)}<div class="grow"><div class="nt">${esc(i.title)}</div><div class="nd">${esc(i.detail)}</div></div>
      <div class="nacts">${i.alt?`<button class="link small" data-act="${i.alt.a}" data-id="${i.alt.id}">${i.alt.l}</button>`:''}${i.act?`<button class="btn sm ${i.rank===1||i.rank===2?'primary':''}" data-act="${i.act.a}" ${i.act.id?`data-id="${i.act.id}"`:''} ${i.act.k?`data-k="${i.act.k}"`:''}>${i.act.l}</button>`:''}${i.dismiss?`<button class="x sm" data-act="dismsg" data-k="${esc(i.key)}" aria-label="Hide until next month">×</button>`:''}</div></div>`).join('')}
    ${items.length>3?`<button class="link small" data-act="attall" style="padding:8px 0">${ATT_ALL?'Show fewer':'Show all '+items.length}</button>`:''}</section>`;
}

function delEntries(){

  if(DEL.ids){const s=new Set(DEL.ids);return L.filter(t=>s.has(t.id)&&canEditTx(t))}

// what deleting would remove (dels) and change (patches), with a plain summary
function delPlan(){

    else{let n=0;Object.entries(D.cards).forEach(([id,c])=>{const ks=Object.keys(c.stmts||{}).filter(k=>mEnd(k)>=a&&mStart(k)<=b);if(ks.length){n+=ks.length;patch('cards',id,cur=>{const o={...cur,stmts:{...cur.stmts}};ks.forEach(k=>delete o.stmts[k]);return o})}});if(n)lines.push(`${n} card statement${n>1?'s':''}`)}}
  if(W.assets){const snaps=Object.entries(D.assets).filter(([,x])=>x.kind==='snap'&&(all||(mEnd(x.month)>=a&&mStart(x.month)<=b))).map(([id])=>id);snaps.forEach(id=>dels.push({col:'assets',id}));
    let n=0;if(all){const ids=delPickList('assets').map(x=>x[0]).filter(id=>delPicked('assets',id));n=ids.length;ids.forEach(id=>dels.push({col:'assets',id}))}
    if(n||snaps.length)lines.push([n?`${n} investment${n>1?'s':''}`:'',snaps.length?`${snaps.length} net worth snapshot${snaps.length>1?'s':''}`:''].filter(Boolean).join(' and '))}

/* one place that deletes: saves a copy to Recently deleted, writes in batches, offers Undo */
async function delCommit({dels,patches=[],label}){
  const before=[];
  dels.forEach(d=>{const cur=D[d.col][d.id];if(cur!==undefined)before.push({col:d.col,id:d.id,data:cur})});
  patches.forEach(x=>before.push({col:x.col,id:x.id,data:D[x.col][x.id]===undefined?null:D[x.col][x.id]}));
  const ops=[...dels.map(d=>({col:d.col,id:d.id,data:null})),...patches.map(x=>({col:x.col,id:x.id,data:x.data}))];
  const tid='t'+uid();
  try{await bulkSet(ops)}catch(e){writeErr(e);return}
  trashSave(tid,{at:Date.now(),by:ME||'local',label,n:dels.length,items:before});
  log('deleted','data',label);
  toast(`Deleted ${label}.`,{action:'Undo',ms:10000,fn:()=>restoreTrash(tid)});
}
// many writes at once: one upload per 1,000 items, queued if offline
async function bulkSet(ops){
  if(!ops.length)return;
  ops.forEach(o=>{const n={...D[o.col]};if(o.data==null)delete n[o.id];else n[o.id]=o.data;D[o.col]=n});
  if(MODE==='local'){saveLocal();changed();return}
  cacheSoon();changed();
  const rows=ops.map(o=>({family_id:FID,col:o.col,id:o.id,data:o.data,deleted:o.data==null}));
  for(let i=0;i<rows.length;i+=1000){
    const chunk=rows.slice(i,i+1000);const q=()=>chunk.forEach(r=>queueOut({col:r.col,id:r.id,data:r.data,deleted:r.deleted}));
    if(!navigator.onLine){q();continue}
    const {error}=await SB.from('docs').upsert(chunk,{onConflict:'family_id,col,id'});
    if(error){if(isNetErr(error)){q();continue}chunk.forEach(r=>refetchDoc(r.col,r.id));throw{code:error.code==='42501'?'invalid_argument':'server',message:errMsg(error)}}
  }
}
/* ---- Recently deleted (30 days) ---- */
const TRASH_DAYS=30;
const trashLKey=()=>'paisa-trash-'+(FID||'local');
function trashLocal(){try{return JSON.parse(lsGet(trashLKey())||'{}')}catch(e){return{}}}
function trashAll(){return{...trashLocal(),...(D.trash||{})}}
function trashSave(id,obj){
  if(MODE==='cloud'){
    D.trash={...D.trash,[id]:obj};cacheSoon();
    pushDoc({col:'trash',id,data:obj,deleted:false}).catch(()=>{   // database not updated for it yet: keep the copy on this phone
      const n={...D.trash};delete n[id];D.trash=n;const L=trashLocal();L[id]=obj;try{localStorage.setItem(trashLKey(),JSON.stringify(L))}catch(e){}scheduleRender()});
    return}
  store.set('trash',id,obj).catch(()=>{});
}
function trashDrop(id){
  const L=trashLocal();if(L[id]){delete L[id];try{localStorage.setItem(trashLKey(),JSON.stringify(L))}catch(e){}}
  if(D.trash&&D.trash[id]){if(MODE==='cloud'){const n={...D.trash};delete n[id];D.trash=n;cacheSoon();pushDoc({col:'trash',id,data:null,deleted:true}).catch(()=>{});scheduleRender()}else store.del('trash',id).catch(()=>{})}
}
function trashPrune(){const cut=Date.now()-TRASH_DAYS*864e5;Object.entries(trashAll()).forEach(([id,t])=>{if((t.at||0)<cut&&(canAdmin()||t.by===ME))trashDrop(id)})}
async function restoreTrash(id){
  const t=trashAll()[id];if(!t){toast('That was already restored or removed.');return}
  const ops=(t.items||[]).map(x=>({col:x.col,id:x.id,data:x.data}));
  try{await bulkSet(ops)}catch(e){writeErr(e);return}
  trashDrop(id);log('restored','data',t.label);toast(`Restored ${t.label}.`);
}
function trashBody(){
  trashPrune();
  const L=Object.entries(trashAll()).filter(([,t])=>canAdmin()||t.by===ME).sort((a,b)=>(b[1].at||0)-(a[1].at||0));
  if(!L.length)return`<section class="card"><p class="small muted" style="margin:0">Nothing deleted in the last ${TRASH_DAYS} days. Anything you delete stays here for ${TRASH_DAYS} days so you can bring it back.</p></section>`;
  return`<p class="small muted" style="margin:0 2px">Deleted items stay here for ${TRASH_DAYS} days, then go for good.</p>
  <div class="tcard">${L.map(([id,t])=>{const left=Math.max(1,TRASH_DAYS-Math.floor((Date.now()-t.at)/864e5));
    return`<div class="trow static"><span class="ti">${ui('backup',20)}</span><span class="tt"><b>${esc(t.label)}</b><small>${new Date(t.at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})} · ${esc(who(t.by))} · ${left} day${left>1?'s':''} left</small></span>
      <span class="nacts"><button class="pillbtn sm" data-act="trashrestore" data-id="${id}">Restore</button><button class="x sm" data-act="trashdrop" data-id="${id}" aria-label="Delete for good">×</button></span></div>`}).join('')}</div>`;
}

/* ================= Habits: the PRD's own success measures, from the family's data ================= */
function habitStats(){
  const t=todayISO(),tx=Object.values(D.tx).filter(x=>x&&x.date);
  const mine=tx.filter(x=>MODE!=='cloud'||x.by===ME);
  const secs=mine.filter(x=>typeof x.secs==='number'&&x.secs>0&&x.secs<300).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,30).map(x=>x.secs).sort((a,b)=>a-b);
  const median=secs.length?secs[Math.floor(secs.length/2)]:null;
  const from=addDays(t,-27);const days=new Set(mine.filter(x=>x.at).map(x=>iso(new Date(x.at))).filter(d=>d>=from&&d<=t));
  const perWeek=Math.round(days.size/4*10)/10;
  const s=S();const closed=[1,2,3].map(n=>addM(curKey(),-n)).filter(k=>s&&k>=s.startMonth);
  const done=closed.filter(k=>billsFor(k).every(b=>b.st==='paid'||b.st==='skip'));
  let late=0,billN=0;closed.forEach(k=>billsFor(k).forEach(b=>{billN++;if(b.st==='skip')return;const paid=(txIndex()[k]||{list:[]}).list.filter(x=>x.cat===b.id).map(x=>x.date).sort()[0];if(!paid||daysBetween(b.due,paid)>3)late++}));
  const missedPerMonth=closed.length?Math.round(late/closed.length*10)/10:null;
  const L=acctList();const checked=L.filter(a=>a.checkedAt&&daysBetween(a.checkedAt,t)<=7).length;
  const recent=tx.filter(x=>x.date>=from&&!isXfer(x));const src={manual:0,quick:0,import:0,recurring:0,other:0};
  recent.forEach(x=>{const k=x.src==='manual'||!x.src?'manual':x.src==='share'?'quick':x.src==='import'?'import':x.src==='recurring'?'recurring':'other';src[k]++});
  return{median,secsN:secs.length,perWeek,daysN:days.size,closed:closed.length,done:done.length,missedPerMonth,late,billN,accts:L.length,checked,src,recentN:recent.length};
}

let HELPQ='',HELPT='';
function faqNorm(s){return String(s).toLowerCase().replace(/<[^>]+>/g,'').replace(/[^a-z0-9₹ ]+/g,' ')}
function faqFind(q,topic){
  const words=faqNorm(q).split(/\s+/).filter(w=>w.length>1&&!['how','do','i','the','my','to','a','is','can','what','does','and','of','in','an','it','for'].includes(w));
  return FAQ.map((f,i)=>{const[t,qq,a,tags]=f;if(topic&&t!==topic)return null;if(!words.length)return{i,s:0};
    const Q=faqNorm(qq),A=faqNorm(a),T=faqNorm(tags);let s=0;
    for(const w of words){const stem=w.length>4?w.replace(/(ing|ed|es|s)$/,''):w;let hit=0;if(Q.includes(stem))hit=3;else if(T.includes(stem))hit=2;else if(A.includes(stem))hit=1;if(!hit)return null;s+=hit}
    return{i,s}}).filter(Boolean).sort((x,y)=>y.s-x.s);
}
function faqMark(html,q){
  const words=faqNorm(q).split(/\s+/).filter(w=>w.length>2);if(!words.length)return html;
  return html.replace(/(^|>)([^<]+)/g,(m,a,txt)=>a+words.reduce((s,w)=>s.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'),txt));
}
function faqItem(i,open){
  const[t,q,a,,act]=FAQ[i];
  const btn=act?(act[1]==='link'?`<a class="pillbtn sm" href="${act[2]}">${act[0]} ›</a>`:`<button class="pillbtn sm" data-act="${act[1]}" data-k="${act[2]}">${act[0]} ›</button>`):'';
  return`<details class="faq" ${open?'open':''}><summary><span>${faqMark(esc(q),HELPQ)}</span>${CHEV}</summary><div class="fa"><p>${faqMark(a,HELPQ)}</p>${btn}</div></details>`;
}

    return`<p class="small muted" style="margin:0 2px 8px">${r.length} answer${r.length>1?'s':''}</p><div class="faqs">${r.map((x,j)=>faqItem(x.i,j===0&&r.length<=3)).join('')}</div>`}

function stmDate(v){
  if(v instanceof Date&&!isNaN(v))return iso(v);
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  const s=String(v||'').trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))){const y=m[3].length===2?2000+(+m[3]):+m[3];const d=+m[1],mo=+m[2];if(mo>=1&&mo<=12&&d>=1&&d<=31)return y+'-'+pad(mo)+'-'+pad(d)}
  if((m=s.match(/^(\d{1,2})[\s\-\/]([A-Za-z]{3})[A-Za-z]*[\s\-\/,]+(\d{2,4})/))){const mo=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase())+1;const y=m[3].length===2?2000+(+m[3]):+m[3];if(mo)return y+'-'+pad(mo)+'-'+pad(+m[1])}
  return null;
}
function stmAmt(v){if(typeof v==='number')return Math.round(Math.abs(v)*100);const s=String(v||'').replace(/[₹,\s]|inr|rs\.?/gi,'').replace(/(cr|dr)$/i,'');const n=parseFloat(s);return isFinite(n)?Math.round(Math.abs(n)*100):0}
const STM_STOP=/^(upi|dr|cr|imps|neft|rtgs|pos|atm|p2a|p2m|payment|paid|transfer|trf|to|by|from|ref|txn|ach|nach|ecs|mmt|bil|onl|inb|vps|ybl|okaxis|okhdfcbank|okicici|oksbi|paytm|axl|ibl|apl|upi ref|purchase|debit|credit|card|ending|india|pvt|ltd|limited|the|and|via|online)$/i;
function stmMerchant(desc){
  const s=String(desc||'');const vpa=s.match(/([a-z0-9._-]{3,})@[a-z]+/i);
  const toks=s.split(/[\/|\-:*#]+|\s{2,}/).map(x=>x.trim()).filter(Boolean);
  for(const tk of toks){if(/^[A-Z]{4}0/.test(tk))continue;   // bank branch codes (IFSC)
    const w=tk.replace(/[^A-Za-z&' ]+/g,' ').split(/\s+/).filter(x=>x.length>2&&!STM_STOP.test(x)&&!/^x+$/i.test(x)).join(' ');
    if(w.length<3)continue;return w.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()).slice(0,28)}
  return vpa?vpa[1].replace(/[._-]+/g,' ').replace(/\d+/g,'').trim().replace(/\b\w/g,c=>c.toUpperCase()):'';
}
const STM_KEYS=[[/swiggy|zomato|domino|mcdonald|kfc|pizza|cafe|restaurant|starbucks|eatsure/i,/eat|food|dining|restaurant/i],[/bigbasket|blinkit|zepto|dmart|grofers|jiomart|grocery|supermarket|more retail|instamart/i,/grocer/i],
  [/uber|ola|rapido|petrol|fuel|hpcl|bpcl|iocl|indian oil|shell|metro|irctc|fastag/i,/transport|fuel|travel|commute/i],[/amazon|flipkart|myntra|ajio|nykaa|meesho|tata cliq/i,/shop/i],
  [/apollo|pharm|medplus|1mg|hospital|clinic|diagnostic|netmeds/i,/health|medical/i],[/netflix|hotstar|spotify|prime|youtube|jio|airtel|vodafone|vi |bsnl|electric|bescom|tata power|gas|water|broadband/i,/bill|utilit|phone|internet|subscri|electric/i],
  [/salary|sal cr|payroll/i,/salary|income/i],[/interest/i,/interest|income/i]];
function stmGuessCat(r){
  const inc=r.dir==='in';const pool=catsAll().filter(c=>!c.archived&&(inc?c.section==='income':c.section!=='income'));
  const g=guessCat(r.amt,r.merchant);if(g&&pool.some(c=>c.id===g))return g;
  for(const [re,catRe] of STM_KEYS)if(re.test(r.desc)){const c=pool.find(c=>catRe.test(c.name));if(c)return c.id}
  if(inc&&!/salary|sal cr|payroll/i.test(r.desc)){const c=pool.find(c=>/other|misc|refund|interest|cashback/i.test(c.name))||pool.find(c=>!/salary/i.test(c.name));if(c)return c.id}
  return(pool.find(c=>/misc|other/i.test(c.name))||pool.find(c=>c.section==='expenses')||pool[0]||{}).id||'';
}
async function stmRead(file){
  let X;try{X=await loadXLSX()}catch(e){toast("Couldn't load the reader. Check your connection.");return null}
  let wb;try{wb=/\.csv$/i.test(file.name)?X.read(await file.text(),{type:'string',raw:true}):X.read(await file.arrayBuffer(),{cellDates:true})}catch(e){toast("Couldn't read that file. Download the statement as Excel or CSV.");return null}
  for(const name of wb.SheetNames){
    const rows=X.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
    const hi=rows.findIndex(r=>r.some(c=>/date/i.test(String(c)))&&r.some(c=>/withdraw|debit|dr\b|amount/i.test(String(c))));if(hi<0)continue;
    const H=rows[hi].map(c=>String(c).trim().toLowerCase());const f=re=>H.findIndex(h=>re.test(h));
    const ci={date:[/^(txn|tran|transaction)\.?\s*date/,/^date/,/date/].map(f).find(i=>i>=0),desc:f(/narration|description|particular|details|remark/),dr:f(/withdraw|debit|^dr\b|dr amount/),cr:f(/deposit|credit|^cr\b|cr amount/),amt:f(/^amount|txn amount|transaction amount/),type:f(/dr\s*\/\s*cr|cr\s*\/\s*dr|^type$/),bal:f(/balance/)};
    const out=[];let closing=null,lastDate=null;
    for(const r of rows.slice(hi+1)){const date=stmDate(r[ci.date]);if(!date)continue;
      let dr=ci.dr>=0?stmAmt(r[ci.dr]):0,cr=ci.cr>=0?stmAmt(r[ci.cr]):0;
      if(!dr&&!cr&&ci.amt>=0){const v=r[ci.amt];const a=stmAmt(v);const t=ci.type>=0?String(r[ci.type]):String(v);if(/cr/i.test(t)&&!/dr/i.test(t))cr=a;else if(typeof v==='number'&&v>0&&ci.type<0)cr=a;else dr=a}
      if(!dr&&!cr)continue;const desc=String(ci.desc>=0?r[ci.desc]:'').replace(/\s+/g,' ').trim();
      out.push({date,desc,dir:dr?'out':'in',amt:dr||cr,merchant:stmMerchant(desc)});
      if(ci.bal>=0&&String(r[ci.bal]).trim()!==''){closing=stmAmt(r[ci.bal]);lastDate=date}}
    if(out.length)return{rows:out,closing,lastDate};
  }
  toast("Couldn't find the transactions in that file. It needs Date and Withdrawal/Deposit (or Amount) columns.");return null;
}
// pair each statement line with an entry already in Paisa: same amount, same direction, within 3 days
function stmMatch(rows,acct){
  const used=new Set();const pool=Object.entries(D.tx).map(([id,t])=>({...t,id}));
  const dirOf=t=>isXfer(t)?(t.from===acct?'out':t.to===acct?'in':null):(D.cats[t.cat]&&D.cats[t.cat].section==='income'?'in':'out');
  rows.forEach(r=>{let best=null,bd=9;
    for(const t of pool){if(used.has(t.id)||t.amt!==r.amt||dirOf(t)!==r.dir)continue;if(!isXfer(t)&&t.acct&&t.acct!==acct)continue;if(!isXfer(t)&&t.mode==='Card')continue;
      const d=Math.abs(daysBetween(t.date,r.date));if(d<=3&&(d<bd||(d===bd&&t.acct===acct))){best=t;bd=d}}
    if(best){used.add(best.id);r.match=best.id}else{r.match=null;r.cat=stmGuessCat(r);r.on=true}});
  return rows;
}

const cacheKey=()=>'paisa-cloud-'+FID, outKey=()=>'paisa-outbox-'+FID;
function cacheSave(){if(FID)try{localStorage.setItem(cacheKey(),JSON.stringify(D))}catch(e){}}
let cacheT=null;function cacheSoon(){clearTimeout(cacheT);cacheT=setTimeout(cacheSave,300)}
function outbox(){try{return JSON.parse(localStorage.getItem(outKey())||'[]')}catch(e){return[]}}
function outSave(a){try{localStorage.setItem(outKey(),JSON.stringify(a))}catch(e){}PENDING=a.length}
function queueOut(op){const a=op.patch?outbox():outbox().filter(x=>!(x.col===op.col&&x.id===op.id));a.push(op);outSave(a);scheduleRender()}
function clearFamilyCache(){if(!FID)return;lsSet(cacheKey(),null);lsSet(outKey(),null);lsSet(syncKey(),null);lsSet('paisa-fid-'+ME,null)}
async function pushDoc(op){
  const {error}=await SB.from('docs').upsert({family_id:FID,col:op.col,id:op.id,data:op.data,deleted:op.deleted},{onConflict:'family_id,col,id'});
  if(error)throw error;
}
let PATCH_RPC=true;   // turns off if the database hasn't had supabase/v4.sql yet
async function pushPatch(op){
  if(PATCH_RPC){const {error}=await SB.rpc('patch_doc',{p_col:op.col,p_id:op.id,p_path:op.path,p_value:op.value});
    if(!error)return;if(!(error.code==='PGRST202'||error.code==='42883'||/patch_doc/.test(error.message||'')))throw error;PATCH_RPC=false}
  await pushDoc({col:op.col,id:op.id,data:D[op.col][op.id]||{},deleted:false});
}
function cloudPatch(op){
  return enqueue(op.col+'/'+op.id,async()=>{
    if(!navigator.onLine){queueOut(op);return}
    try{await pushPatch(op)}catch(e){if(isNetErr(e)){queueOut(op);return}refetchDoc(op.col,op.id);throw{code:e.code==='42501'?'invalid_argument':'server',message:errMsg(e)}}
  });
}
function cloudWrite(op){
  return enqueue(op.col+'/'+op.id,async()=>{
    if(!navigator.onLine){queueOut(op);return}
    try{await pushDoc(op)}catch(e){
      if(isNetErr(e)){queueOut(op);return}
      refetchDoc(op.col,op.id);   // the server refused: show its version again
      throw {code:e.code==='42501'?'invalid_argument':'server',message:errMsg(e)};
    }
  });
}
let flushing=false;
async function flushOut(){
  if(flushing||!SB||!FID||!navigator.onLine)return;flushing=true;
  let a=outbox();
  while(a.length){
    const op=a[0];
    try{await(op.patch?pushPatch(op):pushDoc(op))}catch(e){if(isNetErr(e))break;refetchDoc(op.col,op.id);toast("An offline change wasn't allowed for your role and was undone.")}
    a.shift();outSave(a);
  }
  flushing=false;scheduleRender();
}
async function refetchDoc(col,id){
  const {data}=await SB.from('docs').select('data,deleted').eq('family_id',FID).eq('col',col).eq('id',id).maybeSingle();
  applyRow({col,id,data:data?data.data:null,deleted:!data||data.deleted});
}
function applyRow(r){
  if(!COLS.includes(r.col))return;
  if(outbox().some(o=>o.col===r.col&&o.id===r.id))return; // a newer local change is waiting to upload
  const n={...D[r.col]};if(r.deleted||r.data==null)delete n[r.id];else n[r.id]=r.data;D[r.col]=n;
  if(r.col==='tx'&&r.data&&r.data.by&&r.data.byName&&!NAMES[r.data.by])NAMES[r.data.by]=r.data.byName;
  cacheSoon();changed();
}
const syncKey=()=>'paisa-sync-'+FID;
async function loadAllDocs(){
  let since=null;try{const s=JSON.parse(lsGet(syncKey())||'null');if(s&&DOCS_READY&&Date.now()-s.full<7*864e5)since=s}catch(e){}
  const all={};COLS.forEach(c=>all[c]=since?{...D[c]}:{});let maxAt=since?since.at:'';
  for(let from=0;;from+=1000){
    let q=SB.from('docs').select('col,id,data,deleted,updated_at').eq('family_id',FID);
    q=since?q.gt('updated_at',since.at):q.eq('deleted',false);
    const {data,error}=await q.order('updated_at').order('col').order('id').range(from,from+999);
    if(error)throw error;
    data.forEach(r=>{if(!all[r.col])return;if(r.deleted||r.data==null)delete all[r.col][r.id];else all[r.col][r.id]=r.data;if(r.updated_at>maxAt)maxAt=r.updated_at});
    if(data.length<1000)break;
  }
  outbox().forEach(op=>{if(!all[op.col])return;if(op.patch)all[op.col][op.id]=setDeep(JSON.parse(JSON.stringify(all[op.col][op.id]||{})),op.path,op.value);else if(op.deleted)delete all[op.col][op.id];else all[op.col][op.id]=op.data});
  COLS.forEach(c=>D[c]=all[c]);
  Object.values(D.tx).forEach(t=>{if(t.by&&t.byName&&!NAMES[t.by])NAMES[t.by]=t.byName});
  if(maxAt)lsSet(syncKey(),JSON.stringify({at:maxAt,full:since?since.full:Date.now()}));
  DOCS_READY=true;cacheSave();changed();
}

async function afterSignIn(user){
