<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paisa Planner</title>
<meta name="description" content="Plan your monthly budget, log spending in seconds and never miss a bill or EMI.">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">

<link rel="manifest" href="manifest.webmanifest">
