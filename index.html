<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paisa Planner</title>
<meta name="description" content="Plan your monthly budget, log spending in seconds and never miss a bill or EMI.">
<meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paisa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column; sticky month bar on top, five tabs + floating add at the bottom. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunk:#E8ECEA; --ink:#14201B; --muted:#5B6863; --line:#D9E0DC;
  --accent:#2C47C9; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB;
  --good:#1D7F52; --good-soft:#DDF1E6; --bad:#BF3328; --bad-soft:#FBE3E0; --warn:#9A6411; --warn-soft:#FBEED6;
  --c-income:#1D8A5A; --c-savings:#2F6FDE; --c-bills:#7C5CF0; --c-expenses:#D9821A; --c-debt:#CF3F59;
  --shadow:0 1px 2px rgba(20,32,27,.06),0 8px 24px rgba(20,32,27,.08);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --sunk:#222B27; --ink:#E7EEEA; --muted:#97A49E; --line:#2D3833;
  --accent:#8EA2FF; --accent-ink:#0F1513; --accent-soft:#252E52;
  --good:#5CCB92; --good-soft:#18352A; --bad:#FF8577; --bad-soft:#3D1F1C; --warn:#F2B451; --warn-soft:#3A2E17;
  --c-income:#4FC88B; --c-savings:#6E9BFF; --c-bills:#A890FF; --c-expenses:#F0A64A; --c-debt:#FF7A90;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --sunk:#222B27; --ink:#E7EEEA; --muted:#97A49E; --line:#2D3833;
  --accent:#8EA2FF; --accent-ink:#0F1513; --accent-soft:#252E52;
  --good:#5CCB92; --good-soft:#18352A; --bad:#FF8577; --bad-soft:#3D1F1C; --warn:#F2B451; --warn-soft:#3A2E17;
  --c-income:#4FC88B; --c-savings:#6E9BFF; --c-bills:#A890FF; --c-expenses:#F0A64A; --c-debt:#FF7A90;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px}
.topbar h1{font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mswitch{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.mswitch button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted)}
.mswitch button:hover{background:var(--sunk)}
.mswitch span{font-weight:600;font-size:14px;min-width:78px;text-align:center}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero .big{font-family:var(--f-display);font-size:clamp(32px,9vw,42px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.hero .big.neg{color:var(--bad)}
.ring{width:112px;height:112px;cursor:pointer;border:0;background:none;padding:0}
.ring svg{display:block}
.kv{display:flex;justify-content:space-between;gap:12px;padding-block:6px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
/* chips + pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-paid{background:var(--good-soft);color:var(--good)}
.p-over,.p-overdue{background:var(--bad-soft);color:var(--bad)}
.p-due{background:var(--warn-soft);color:var(--warn)}
.p-up{background:var(--sunk);color:var(--muted)}
.p-skip{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:14px}
.alert b{font-weight:600}
.a-bad{background:var(--bad-soft);color:var(--bad)}
.a-warn{background:var(--warn-soft);color:var(--warn)}
.a-good{background:var(--good-soft);color:var(--good)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;background:currentColor}
/* rows */
.row{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted)}
.row .amt{font-weight:600;text-align:right;white-space:nowrap}
.rowbtn{width:100%;text-align:left;background:none;border:0;padding:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%;padding:13px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
/* sections */
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sec-h h2{flex:1}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.bar{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:999px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:right}
.grid3 .h{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.catrow{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:6px;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);font-size:14px}
.catrow:last-child{border-bottom:0}
.catrow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.catrow .v{text-align:right;font-variant-numeric:tabular-nums}
.catrow.head{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-block:4px}
.catrow.tot{font-weight:700}
.over{color:var(--bad);font-weight:600}
button.catrow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
button.catrow:hover{background:var(--sunk)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:26;right:max(18px,calc(50vw - 262px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);font-size:30px;line-height:1;display:grid;place-items:center}
@media (max-width:560px){.fab{right:calc(18px + env(safe-area-inset-right,0px))}}
/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,16,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet h2{font-size:18px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.x{border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;font-size:18px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .sw{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:2px;vertical-align:1px}
.amtdisp{font-family:var(--f-display);font-size:40px;font-weight:700;text-align:center;padding:6px 0 10px;letter-spacing:-.02em}
.amtdisp.empty{color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.keypad button{border:0;background:var(--sunk);border-radius:12px;padding:13px 0;font-size:20px;font-weight:600}
.keypad button:active{background:var(--line)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* toast */
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline}
/* misc */
.empty-state{text-align:center;padding:28px 12px;color:var(--muted)}
.dayh{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;padding-top:12px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters .input{padding:8px 10px;font-size:14px}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
tfoot td{font-weight:700;border-bottom:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal .d{padding:6px 0;border-radius:8px;position:relative;color:var(--muted)}
.cal .d.has{color:var(--ink);font-weight:600;background:var(--sunk)}
.cal .d.today{outline:2px solid var(--accent)}
.cal .d i{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;background:var(--accent-soft);color:var(--ink)}
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.lock .dots{display:flex;gap:12px}
.lock .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.lock .dots i.on{background:var(--ink)}
.lock .keypad{width:min(300px,100%)}
.privacy{position:fixed;inset:0;z-index:79;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none}
.onb h1{font-size:26px}
.check{display:flex;align-items:center;gap:10px;padding-block:7px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.check .input{width:110px;padding:6px 8px;text-align:right}
.check span{flex:1;min-width:0}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
}
html{padding-top:env(safe-area-inset-top,0px)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:340px;margin:0 auto;padding:12px 16px;border-radius:999px;border:1px solid #DADCE0;background:#FFFFFF;color:#1F1F1F;font-weight:600;font-size:15px;font-family:var(--f-body)}
.gbtn:hover{background:#F7F8F8}
.gbtn svg{width:20px;height:20px;flex:none}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.rolesel{width:auto;padding:6px 8px;font-size:13px}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app" id="app"><div class="empty-state" style="padding-top:30vh">Loading your budget…</div></div>
<div class="tabs" id="tabs" hidden></div>
<button class="fab" id="fab" aria-label="Add expense or income" hidden>+</button>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<div id="lockRoot"></div>

<script>
"use strict";
/* ================= constants ================= */
const SECTIONS=[
  {k:'income',n:'Income'},{k:'savings',n:'Savings & Investments'},{k:'bills',n:'Bills'},
  {k:'expenses',n:'Expenses'},{k:'debt',n:'Debt / EMIs'}];
const SECN=Object.fromEntries(SECTIONS.map(s=>[s.k,s.n]));
const OUT=['savings','bills','expenses','debt'];
const MODES=['UPI','Card','Cash','Net banking','Auto-debit'];
const COLS=['settings','cats','tx','months','bills','loans','cards','goals','log'];
const ROUTES=['home','transactions','budget','plan','family','bills','reports','prefs'];
const STARTER={
  income:[['Salary',120000],['Other income',0]],
  savings:[['SIP / mutual funds',15000],['Recurring deposit',5000],['Emergency fund',5000]],
  bills:[['Rent',25000,5],['Electricity',2000,10],['Mobile & internet',1200,15],['House help',4000,1]],
  expenses:[['Groceries',10000],['Eating out',4000],['Transport & fuel',4000],['Shopping',3000],['Health',2000],['Family support',10000],['Miscellaneous',2000]],
  debt:[['Home loan EMI',25000,5],['Personal loan EMI',8000,10],['Credit card payment',20000,18]]
};

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INR=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
function fmt(p,o={}){const v=Math.round((p||0)/100);const s=INR.format(Math.abs(v));if(v<0)return '−₹'+s;return (o.plus&&v>0?'+':'')+'₹'+s}
function fmtShort(p){const v=Math.abs((p||0)/100);let s;if(v>=1e7)s=(v/1e7).toFixed(v>=1e8?0:1)+'Cr';else if(v>=1e5)s=(v/1e5).toFixed(v>=1e6?0:1)+'L';else if(v>=1e3)s=(v/1e3).toFixed(v>=1e4?0:1)+'k';else s=String(Math.round(v));return (p<0?'−':'')+'₹'+s.replace('.0','')}
function parseAmt(s){if(s==null)return NaN;s=String(s).replace(/[₹,\s]/g,'');if(s==='')return NaN;const n=Number(s);return isFinite(n)?Math.round(n*100):NaN}
const rupees=p=>p==null?'':String(Math.round(p)/100);
const pad=n=>String(n).padStart(2,'0');
const dim=(y,m)=>new Date(y,m,0).getDate();
const ym=(y,m)=>y+'-'+pad(m);
function addM(key,n){let[y,m]=key.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return ym(y,m)}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const todayISO=()=>iso(new Date());
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function mLabel(k){const[y,m]=k.split('-').map(Number);return MON[m-1]+' '+y}
function mLong(k){const[y,m]=k.split('-').map(Number);return MONL[m-1]}
function dLabel(ds){const[y,m,d]=ds.split('-').map(Number);const dt=new Date(y,m-1,d);return dt.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}
function dShort(ds){const[y,m,d]=ds.split('-').map(Number);return d+' '+MON[m-1]}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
function addDays(ds,n){const d=new Date(ds+'T00:00');d.setDate(d.getDate()+n);return iso(d)}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

/* ================= store ================= */
const D={};COLS.forEach(c=>D[c]={});
let DB=null,USER=null,ME=null,MODE='loading',ROLE='Owner',IS_OWNER=true;
let loadedCols=new Set(),loadTimer=null,stale=false;
const NAMES={};
const queues={};
function enqueue(path,fn){const p=(queues[path]||Promise.resolve()).then(fn,fn);queues[path]=p.catch(()=>{});return p}
function writeErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument')toast("Your role can't change this. Ask the family Owner or an Admin.");
  else if(c==='server')toast(e.message||"Couldn't save.");
  else if(c==='quota_exceeded')toast('Storage is full. Delete old entries to add new ones.');
  else if(c==='revoked')toast('Your access to this budget was removed.');

/* ================= calculations (single source of truth) ================= */
let memo={};
function changed(){memo={};scheduleRender()}
const S=()=>D.settings.main||null;
const sd=()=>(S()&&S().startDay)||1;
function keyOf(ds){const[y,m,d]=ds.split('-').map(Number);const s=Math.min(sd(),dim(y,m));return d<s?addM(ym(y,m),-1):ym(y,m)}
function mStart(k){const[y,m]=k.split('-').map(Number);return ym(y,m)+'-'+pad(Math.min(sd(),dim(y,m)))}
function mEnd(k){return addDays(mStart(addM(k,1)),-1)}
const curKey=()=>keyOf(todayISO());
function catsAll(){
  if(memo.cats)return memo.cats;
  const order=Object.fromEntries(SECTIONS.map((s,i)=>[s.k,i]));
  return memo.cats=Object.entries(D.cats).map(([id,c])=>({...c,id})).sort((a,b)=>(order[a.section]-order[b.section])||((a.order||0)-(b.order||0))||a.name.localeCompare(b.name));
}
const catById=id=>D.cats[id]?{...D.cats[id],id}:null;
function txIndex(){
  if(memo.ti)return memo.ti;
  const ti={};
  for(const[id,t]of Object.entries(D.tx)){
    if(!t||!t.date)continue;
    const k=keyOf(t.date);const e=ti[k]||(ti[k]={list:[],byCat:{}});
    e.list.push({...t,id});e.byCat[t.cat]=(e.byCat[t.cat]||0)+(t.amt||0);
  }
  for(const k in ti)ti[k].list.sort((a,b)=>b.date.localeCompare(a.date)||(b.at||0)-(a.at||0));
  return memo.ti=ti;
}
function budgetOf(c,k){
  const ov=D.months[k]&&D.months[k].b&&D.months[k].b[c.id];
  if(ov!=null)return ov;
  const h=(c.hist||[]).slice().sort((a,b)=>a.from.localeCompare(b.from));
  let v=h.length?h[0].amt:0;
  for(const e of h)if(e.from<=k)v=e.amt;
  return v;
}
function opening(k){
  const s=S();if(!s)return 0;
  const ov=D.months[k]&&D.months[k].open;
  if(ov!=null)return ov;
  if(k<s.startMonth)return 0;
  if(k===s.startMonth)return s.opening||0;
  return month(addM(k,-1)).close;
}
function month(k){
  memo.m=memo.m||{};
  if(memo.m[k])return memo.m[k];
  // compute earlier months iteratively first (avoids deep recursion)
  const s=S();
  if(s&&k>s.startMonth&&!memo.m[addM(k,-1)]){let p=s.startMonth;while(p<k){month(p);p=addM(p,1)}}
  const ti=txIndex()[k]||{list:[],byCat:{}};
  const cats=catsAll().filter(c=>!c.archived||ti.byCat[c.id]).map(c=>{
    const budget=budgetOf(c,k),actual=ti.byCat[c.id]||0;
    return{...c,budget,actual,left:budget-actual};
  });
  const sec={};SECTIONS.forEach(x=>sec[x.k]={b:0,a:0});
  cats.forEach(c=>{if(sec[c.section]){sec[c.section].b+=c.budget;sec[c.section].a+=c.actual}});
  const open=opening(k);
  const income=sec.income.a;
  const spent=OUT.reduce((t,x)=>t+sec[x].a,0);
  const planned=OUT.reduce((t,x)=>t+sec[x].b,0);
  const close=open+income-spent;
  // still to pay = budget not yet used on outflow categories
  const toPay=cats.filter(c=>OUT.includes(c.section)).reduce((t,c)=>t+Math.max(0,c.left),0);
  const incomeToCome=Math.max(0,sec.income.b-sec.income.a);
  return memo.m[k]={key:k,cats,sec,open,income,spent,planned,close,toPay,incomeToCome,list:ti.list,
    available:open+income,left:open+income-spent,projected:open+income+incomeToCome-spent-toPay};
}
function spentShare(m){if(m.available<=0)return 1;return clamp(m.spent/m.available,0,1)}
function dueDate(c,k){
  const[y,m]=k.split('-').map(Number);const d=c.dueDay;
  if(sd()===1||d>=sd())return ym(y,m)+'-'+pad(Math.min(d,dim(y,m)));
  const n=addM(k,1);const[y2,m2]=n.split('-').map(Number);return n+'-'+pad(Math.min(d,dim(y2,m2)));
}
function billsFor(k){
  const m=month(k),t=todayISO(),skip=(D.bills[k]&&D.bills[k].skip)||{};
  return m.cats.filter(c=>(c.section==='bills'||c.section==='debt')&&c.dueDay&&!c.archived).map(c=>{
    const due=dueDate(c,k);let st,label;
    if(c.actual>0){st='paid';label='Paid'}
    else if(skip[c.id]){st='skip';label='Skipped'}
    else{const dd=daysBetween(t,due);
      if(dd<0){st='overdue';label='Overdue '+(-dd)+'d'}
      else if(dd===0){st='due';label='Due today'}
      else if(dd<=3){st='due';label='Due in '+dd+'d'}
      else{st='up';label='Upcoming'}}
    return{...c,due,st,label};
  }).sort((a,b)=>a.due.localeCompare(b.due));
}
function loanCalc(P,annual,E){
  const i=annual/100/12;
  if(P<=0)return{n:0,interest:0};
  if(E<=0)return{err:'Add the EMI amount'};
  if(i===0){const n=Math.ceil(P/E);return{n,interest:Math.max(0,E*n-P)}}
  if(E<=i*P)return{err:'EMI too low to repay'};
  const n=Math.ceil(-Math.log(1-i*P/E)/Math.log(1+i));
  return{n,interest:Math.max(0,E*n-P)};
}
function loanOutstanding(l){
  // each EMI recorded after the "as of" date reduces the estimate
  let P=l.outstanding||0;const i=(l.rate||0)/100/12;
  if(!l.cat)return P;
  const paid=Object.values(D.tx).filter(t=>t.cat===l.cat&&t.date>(l.asOf||'')).length;
  for(let n=0;n<paid&&P>0;n++)P=Math.max(0,P-Math.max(0,(l.emi||0)-Math.round(P*i)));
  return P;
}
function cardStatus(st){if(!st||!st.amt)return null;const p=st.paid||0;if(p>=st.amt)return'full';if(p>0)return'part';return'none'}
function goalCalc(g){
  const prog=g.target>0?clamp((g.saved||0)/g.target,0,1):0;
  const rem=Math.max(0,(g.target||0)-(g.saved||0));
  const n=rem===0?0:(g.monthly>0?Math.ceil(rem/g.monthly):Infinity);
  let on=null;
  if(g.date&&isFinite(n)){on=addM(curKey(),n)<=g.date.slice(0,7)}else if(g.date)on=false;
  return{prog,n,on};
}
function chainKeys(){const s=S();if(!s)return[];const out=[];let k=s.startMonth;const last=[curKey(),...Object.keys(txIndex())].sort().pop();while(k<=last&&out.length<240){out.push(k);k=addM(k,1)}return out}

function bvaChart(m){

function donut(m){
  const parts=OUT.map(k=>({k,n:SECN[k],v:m.sec[k].a})).filter(p=>p.v>0);
  const tot=parts.reduce((t,p)=>t+p.v,0);

  const r=44,c=2*Math.PI*r;let off=0;

  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Spend split">${segs}<text x="60" y="58" text-anchor="middle" font-size="10" fill="var(--muted)">Total out</text><text x="60" y="73" text-anchor="middle" font-family="Sora,sans-serif" font-weight="700" font-size="14" fill="var(--ink)">${fmtShort(tot)}</text></svg>

}
function expBars(m){

/* ================= BILLS ================= */
function billsView(){

  const byDate={};bl.forEach(b=>(byDate[b.due]=byDate[b.due]||[]).push(b));
  const first=new Date(s+'T00:00');const lead=(first.getDay()+6)%7;const n=daysBetween(s,e)+1;
  let cal='<div class="cal">'+['M','T','W','T','F','S','S'].map(x=>`<div class="small muted" style="font-weight:600">${x}</div>`).join('');
  for(let i=0;i<lead;i++)cal+='<div></div>';
  for(let i=0;i<n;i++){const ds=addDays(s,i);const bs=byDate[ds];const worst=bs&&(bs.some(b=>b.st==='overdue')?'var(--bad)':bs.some(b=>b.st==='due')?'var(--warn)':bs.every(b=>b.st==='paid'||b.st==='skip')?'var(--good)':'var(--muted)');

function quickKey(k){
  if(!QA)return;let a=QA.amt;
  if(k==='⌫')a=a.slice(0,-1);
  else if(k==='.'){if(!a.includes('.'))a=(a||'0')+'.'}
  else{if(a.includes('.')&&a.split('.')[1].length>=2)return;if(a.replace('.','').length>=10)return;a=(a==='0'?'':a)+k}
  QA.amt=a;renderQuick();
}
async function quickSave(){
  const q=QA;if(!q)return;

  const id=q.id||uid();const now=Date.now();
  const obj={byName:q.id?(q.byName||''):(MYNAME||''),cat:q.cat,amt,date:q.date,mode:q.mode,note:q.note,card:q.mode==='Card'?q.card||'':'',src:q.src||'manual',by:q.by||ME||'local',at:q.at||now,ub:ME||'local',uat:now};
  if(q.billKey){/* paid from a bill */}
  const c=D.cats[q.cat];
  closeSheet();
  store.set('tx',id,obj).then(()=>{log(q.id?'edited':'added',c.section==='income'?'income':'entry',`${c.name} ${fmt(amt)}`)}).catch(()=>{});
  toast(`${q.id?'Updated':'Saved'} ${fmt(amt)} · ${c.name}`);
}
function quickDelete(){
  const q=QA;if(!q||!q.id)return;const old=D.tx[q.id];const c=D.cats[old.cat];
  closeSheet();
  store.del('tx',q.id).then(()=>log('deleted','entry',`${c?c.name:''} ${fmt(old.amt)}`)).catch(()=>{});
  toast(`Deleted ${fmt(old.amt)} · ${c?c.name:''}`,{action:'Undo',ms:5000,fn:()=>{store.set('tx',q.id,old).then(()=>log('restored','entry',`${c?c.name:''} ${fmt(old.amt)}`)).catch(()=>{})}});
}

    ${id?`<div class="flabel" style="margin-bottom:6px">Apply budget change to</div><div class="seg" style="margin-bottom:14px" role="group"><button data-act="scope" data-k="month" aria-pressed="false">${mLabel(VM)} only</button><button data-act="scope" data-k="future" aria-pressed="true">This & future months</button></div>`:''}

  `);
  SCOPE='future';
}
let SCOPE='future';
async function saveCat(id,sec){
  const name=$('#c-name').value.trim();if(!name){toast('Give the category a name.');return}
  const amt=parseAmt($('#c-b').value);const dueEl=$('#c-due');let due=dueEl?parseInt(dueEl.value,10):null;
  if(dueEl&&dueEl.value&&!(due>=1&&due<=31)){toast('Due day must be between 1 and 31.');return}
  if(!(due>=1))due=null;
  const b=isNaN(amt)?0:amt;
  if(!id){
    const order=Math.max(0,...catsAll().filter(c=>c.section===sec).map(c=>c.order||0))+1;
    const nid=uid();closeSheet();
    await store.set('cats',nid,{name,section:sec,order,archived:false,dueDay:due,hist:[{from:VM,amt:b}]}).catch(()=>{});
    log('added','category',name);return;
  }
  const c={...D.cats[id]};delete c.id;const old=budgetOf({...c,id},VM);
  c.name=name;c.dueDay=due;
  const mdoc=JSON.parse(JSON.stringify(D.months[VM]||{}));
  if(b!==old||SCOPE==='future'&&mdoc.b&&mdoc.b[id]!=null){
    if(SCOPE==='month'){mdoc.b=mdoc.b||{};mdoc.b[id]=b;await store.set('months',VM,mdoc).catch(()=>{})}
    else{
      c.hist=(c.hist||[]).filter(h=>h.from<VM);
      if(!c.hist.length){const prev=(D.cats[id].hist||[]).slice().sort((a,b)=>a.from.localeCompare(b.from));if(prev.length&&prev[0].from<VM)c.hist.push({from:prev[0].from,amt:old})}
      c.hist.push({from:VM,amt:b});
      if(mdoc.b&&mdoc.b[id]!=null){delete mdoc.b[id];store.set('months',VM,mdoc).catch(()=>{})}
    }
  }
  closeSheet();
  await store.set('cats',id,c).catch(()=>{});
  log('changed','budget',`${name} ${fmt(b)} (${SCOPE==='month'?mLabel(VM)+' only':'from '+mLabel(VM)})`);
}
function moveCat(id,dir){
  const c=D.cats[id];const list=catsAll().filter(x=>x.section===c.section);
  const i=list.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=list.length)return;
  list.forEach((x,n)=>x.order=n);[list[i].order,list[j].order]=[list[j].order,list[i].order];
  list.forEach(x=>{if(D.cats[x.id].order!==x.order){const o={...D.cats[x.id],order:x.order};store.set('cats',x.id,o).catch(()=>{})}});
  toast('Moved '+(dir<0?'up':'down'));
}

async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('paisa:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'x'+s}}
let PIN={mode:null,buf:'',first:''};
function showLock(mode){
  PIN={mode,buf:'',first:''};drawLock();
}
function drawLock(){
  const titles={unlock:'Enter your PIN',set:'Choose a 4-digit PIN',confirm:'Enter the PIN again'};
  $('#lockRoot').innerHTML=`<div class="lock" role="dialog" aria-modal="true" aria-label="App lock"><div class="mark">₹</div><h2>${titles[PIN.mode]}</h2>
  <div class="dots" aria-hidden="true">${[0,1,2,3].map(i=>`<i class="${i<PIN.buf.length?'on':''}"></i>`).join('')}</div><div class="small" id="pinmsg" style="min-height:18px;color:var(--bad)">${PIN.msg||''}</div>
  <div class="keypad">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(x=>x?`<button data-act="pin" data-k="${x}" aria-label="${x==='⌫'?'Delete':x}">${x}</button>`:'<span></span>').join('')}</div>
  ${PIN.mode!=='unlock'?'<button class="link" data-act="pincancel">Cancel</button>':''}</div>`;
}
async function pinKey(k){
  if(k==='⌫')PIN.buf=PIN.buf.slice(0,-1);else if(PIN.buf.length<4)PIN.buf+=k;
  PIN.msg='';
  if(PIN.buf.length===4){
    if(PIN.mode==='unlock'){if(await sha(PIN.buf)===lsGet('paisa-pin')){$('#lockRoot').innerHTML='';return}PIN.msg='Wrong PIN. Try again.';PIN.buf=''}
    else if(PIN.mode==='set'){PIN.first=PIN.buf;PIN.buf='';PIN.mode='confirm'}
    else{if(PIN.buf===PIN.first){lsSet('paisa-pin',await sha(PIN.buf));$('#lockRoot').innerHTML='';toast('PIN set. The app now locks on this device.');render();return}PIN.msg="PINs didn't match. Start again.";PIN.mode='set';PIN.buf=''}
  }
  drawLock();
}

async function saveFile(filename,data,type){
  const blob=data instanceof Blob?data:new Blob([data],{type:type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const file=new File([blob],filename,{type:blob.type});
  // phones: offer the share sheet so the file can go to Drive, WhatsApp or Files
  if(navigator.canShare&&matchMedia('(pointer:coarse)').matches&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:filename});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

let IMP=null;
function secFrom(s){s=String(s||'').toLowerCase();if(s.startsWith('inc'))return'income';if(s.startsWith('sav')||s.includes('invest'))return'savings';if(s.startsWith('bill'))return'bills';if(s.startsWith('debt')||s.includes('emi')||s.includes('loan'))return'debt';if(s.startsWith('exp'))return'expenses';return null}
function toISO(v){
  if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getTime()+12*36e5));
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  const s=String(v||'').trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/)){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad(m[2])+'-'+pad(m[1])}
  const d=new Date(s);return isNaN(d)?null:iso(d);
}
async function handleImport(file){
  let X;try{X=await loadXLSX()}catch(e){toast("Couldn't load the Excel library. Check your connection.");return}
  let wb;try{wb=X.read(await file.arrayBuffer(),{cellDates:true})}catch(e){toast("Couldn't read that file. Save it as .xlsx and try again.");return}
  const find=re=>wb.SheetNames.find(n=>re.test(n));
  const rowsOf=n=>n?X.utils.sheet_to_json(wb.Sheets[n],{defval:''}):[];
  const col=(r,...names)=>{for(const k of Object.keys(r)){const kl=k.toLowerCase().trim();if(names.some(n=>kl===n||kl.startsWith(n)))return r[k]}return''};
  const bName=find(/budget|categor/i);const lName=find(/expense log|log|transaction|entries/i)||(wb.SheetNames.length===1?wb.SheetNames[0]:null);
  const existing={};catsAll().forEach(c=>existing[c.name.toLowerCase()]=c);
  const newCats={};const budgetRows=[];
  rowsOf(bName).forEach(r=>{const name=String(col(r,'category','name')).trim();if(!name)return;const sec=secFrom(col(r,'section','type'))||'expenses';const b=parseAmt(col(r,'budget','planned','amount'));const due=parseInt(col(r,'due'),10);
    budgetRows.push({name,sec,b:isNaN(b)?0:b,due:due>=1&&due<=31?due:null});
    if(!existing[name.toLowerCase()])newCats[name.toLowerCase()]={name,sec,b:isNaN(b)?0:b,due:due>=1&&due<=31?due:null}});
  const tx=[];let skipped=0;
  rowsOf(lName===bName?null:lName).forEach(r=>{const date=toISO(col(r,'date'));const name=String(col(r,'category')).trim();const amt=parseAmt(col(r,'amount','actual','spent'));
    if(!date||!name||!(amt>0)){skipped++;return}
    const sec=secFrom(col(r,'section','type'));
    if(!existing[name.toLowerCase()]&&!newCats[name.toLowerCase()])newCats[name.toLowerCase()]={name,sec:sec||'expenses',b:0,due:null};
    const mode=MODES.find(m=>m.toLowerCase()===String(col(r,'mode','payment')).toLowerCase().trim())||(String(col(r,'mode','payment')).toLowerCase().includes('card')?'Card':'UPI');
    tx.push({date,name,amt,mode,note:String(col(r,'note','description','remarks')).slice(0,120)})});
  if(!tx.length&&!budgetRows.length){toast('No Budget or Expense Log rows found. Use the template’s column names.');return}
  const secOf=n=>(existing[n.toLowerCase()]||{}).section||(newCats[n.toLowerCase()]||{}).sec;
  const byMonth={};tx.forEach(t=>{const k=keyOf(t.date);const e=byMonth[k]||(byMonth[k]={income:0,savings:0,bills:0,expenses:0,debt:0,n:0});e[secOf(t.name)]+=t.amt;e.n++});
  IMP={tx,newCats,budgetRows,skipped};
  const months=Object.keys(byMonth).sort();
  openSheet(`${sheetHead('Check before importing')}
    <p class="small" style="margin-top:0">${tx.length} entries${months.length?' across '+months.length+' month'+(months.length>1?'s':''):''} · ${Object.keys(newCats).length} new categories · ${budgetRows.length} budget rows${skipped?` · ${skipped} rows skipped (missing date, category or amount)`:''}</p>
    ${months.length?`<div class="tablewrap"><table><thead><tr><th>Month</th>${SECTIONS.map(s=>`<th>${s.n.split(' ')[0]}</th>`).join('')}</tr></thead><tbody>${months.map(k=>`<tr><td>${mLabel(k)}</td>${SECTIONS.map(s=>`<td>${fmtShort(byMonth[k][s.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="small muted">Compare each section's totals with your spreadsheet before you import.</p>`:''}
    ${months.length&&months[0]<S().startMonth?`<label class="check"><input type="checkbox" id="imp-start" checked><span class="small">Start the budget from ${mLabel(months[0])} so balances carry forward from there</span></label>
    <div class="field" style="margin-top:8px"><label for="imp-open">Opening balance on ${dShort(mStart(months[0]))} ${months[0].slice(0,4)} (₹)</label><input class="input num" id="imp-open" inputmode="decimal" value="0"></div>`:''}
    <button class="btn primary block" data-act="doimport" style="margin-top:10px">Totals match, import</button>`);
}
async function doImport(){

  closeSheet();toast('Importing…',{ms:60000});
  const ids={};catsAll().forEach(c=>ids[c.name.toLowerCase()]=c.id);

  let n=0;const batch=[];const now=Date.now();
  for(const t of I.tx){batch.push(store.set('tx',uid()+(n++),{cat:ids[t.name.toLowerCase()],amt:t.amt,date:t.date,mode:t.mode,note:t.note,card:'',src:'import',by:ME||'local',at:now,ub:ME||'local',uat:now}).catch(()=>{}));if(batch.length>=8){await Promise.all(batch);batch.length=0}}

}

/* -- offline cache + outbox (per family) -- */
const cacheKey=()=>'paisa-cloud-'+FID, outKey=()=>'paisa-outbox-'+FID;
function cacheSave(){if(FID)try{localStorage.setItem(cacheKey(),JSON.stringify(D))}catch(e){}}
let cacheT=null;function cacheSoon(){clearTimeout(cacheT);cacheT=setTimeout(cacheSave,300)}
function outbox(){try{return JSON.parse(localStorage.getItem(outKey())||'[]')}catch(e){return[]}}
function outSave(a){try{localStorage.setItem(outKey(),JSON.stringify(a))}catch(e){}PENDING=a.length}
function queueOut(op){const a=outbox().filter(x=>!(x.col===op.col&&x.id===op.id));a.push(op);outSave(a);scheduleRender()}
function clearFamilyCache(){if(!FID)return;lsSet(cacheKey(),null);lsSet(outKey(),null);lsSet('paisa-fid-'+ME,null)}
async function pushDoc(op){
  const {error}=await SB.from('docs').upsert({family_id:FID,col:op.col,id:op.id,data:op.data,deleted:op.deleted},{onConflict:'family_id,col,id'});
  if(error)throw error;
}
function cloudWrite(op){
  return enqueue(op.col+'/'+op.id,async()=>{
    if(!navigator.onLine){queueOut(op);return}
    try{await pushDoc(op)}catch(e){
      if(isNetErr(e)){queueOut(op);return}
      refetchDoc(op.col,op.id);   // the server refused: show its version again
      throw {code:e.code==='42501'?'invalid_argument':'server',message:errMsg(e)};
    }
  });
}
let flushing=false;
async function flushOut(){
  if(flushing||!SB||!FID||!navigator.onLine)return;flushing=true;
  let a=outbox();
  while(a.length){
    const op=a[0];
    try{await pushDoc(op)}catch(e){if(isNetErr(e))break;refetchDoc(op.col,op.id);toast("An offline change wasn't allowed for your role and was undone.")}
    a.shift();outSave(a);
  }
  flushing=false;scheduleRender();
}
async function refetchDoc(col,id){
  const {data}=await SB.from('docs').select('data,deleted').eq('family_id',FID).eq('col',col).eq('id',id).maybeSingle();
  applyRow({col,id,data:data?data.data:null,deleted:!data||data.deleted});
}
function applyRow(r){
  if(!COLS.includes(r.col))return;
  if(outbox().some(o=>o.col===r.col&&o.id===r.id))return; // a newer local change is waiting to upload
  const n={...D[r.col]};if(r.deleted||r.data==null)delete n[r.id];else n[r.id]=r.data;D[r.col]=n;
  if(r.col==='tx'&&r.data&&r.data.by&&r.data.byName&&!NAMES[r.data.by])NAMES[r.data.by]=r.data.byName;
  cacheSoon();changed();
}
async function loadAllDocs(){
  const all={};COLS.forEach(c=>all[c]={});
  for(let from=0;;from+=1000){
    const {data,error}=await SB.from('docs').select('col,id,data').eq('family_id',FID).eq('deleted',false).order('col').order('id').range(from,from+999);
    if(error)throw error;
    data.forEach(r=>{if(all[r.col])all[r.col][r.id]=r.data});
    if(data.length<1000)break;
  }
  outbox().forEach(op=>{if(op.deleted)delete all[op.col][op.id];else all[op.col][op.id]=op.data});
  COLS.forEach(c=>D[c]=all[c]);
  Object.values(D.tx).forEach(t=>{if(t.by&&t.byName&&!NAMES[t.by])NAMES[t.by]=t.byName});
  DOCS_READY=true;cacheSave();changed();
}

  if(error)return;

  MEMBERS.forEach(m=>NAMES[m.id]=m.name||m.email);
  const me=MEMBERS.find(m=>m.id===ME);
  if(!me){clearFamilyCache();toast('You are no longer in this family.');return cloudNoFamily()}
  setRoleFrom(me.role);
  INVITES=[];
  if(canAdmin()){const r=await SB.from('invites').select('id,email,role,expires_at').eq('family_id',FID).eq('status','pending').order('created_at');INVITES=(r.data||[]).filter(i=>new Date(i.expires_at)>new Date())}
  scheduleRender();

async function cloudBoot(){

  SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const q=new URLSearchParams(location.search);const oauthErr=q.get('error_description')||q.get('error');
  const {data}=await SB.auth.getSession();
  if(location.search)history.replaceState(null,'',location.pathname+location.hash);
  SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){resetCloud();showSignIn()}});
  if(!data.session)return showSignIn(oauthErr?'Sign-in was cancelled or failed. Try again.':'');
  afterSignIn(data.session.user);

function resetCloud(){if(CH&&SB)SB.removeChannel(CH);CH=null;FID=null;STARTED=null;DOCS_READY=false;MEMBERS=[];INVITES=[];COLS.forEach(c=>D[c]={});memo={};ME=null}
async function afterSignIn(user){
  ME=user.id;EMAIL=(user.email||'').toLowerCase();
  const md=user.user_metadata||{};MYNAME=md.full_name||md.name||EMAIL.split('@')[0];MYAVATAR=md.avatar_url||md.picture||'';NAMES[ME]=MYNAME;
  const cached=lsGet('paisa-fid-'+ME);
  if(cached){FID=cached;startCloud()}       // open instantly from this device's copy
  const {data,error}=await SB.from('family_members').select('family_id,role').eq('user_id',ME).maybeSingle();
  if(error){if(!cached)screen(`<div class="empty-state" style="padding-top:26vh"><h2>Can't reach your budget</h2><p>Check your connection and try again.</p><button class="btn" data-act="reload">Try again</button></div>`);return}
  if(!data){if(cached)clearFamilyCache();return cloudNoFamily()}
  setRoleFrom(data.role);
  if(data.family_id!==FID){if(cached)clearFamilyCache();FID=data.family_id;STARTED=null;startCloud()}else scheduleRender();

async function startCloud(){
  if(STARTED===FID)return;STARTED=FID;
  lsSet('paisa-fid-'+ME,FID);
  COLS.forEach(c=>D[c]={});DOCS_READY=false;
  try{const raw=localStorage.getItem(cacheKey());if(raw){const o=JSON.parse(raw);COLS.forEach(c=>D[c]=o[c]||{});DOCS_READY=true}}catch(e){}
  PENDING=outbox().length;MODE='cloud';render.ready=true;memo={};VM=null;setRoute();
  if(CH)SB.removeChannel(CH);
  CH=SB.channel('family-'+FID)
    .on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'family_id=eq.'+FID},p=>{if(p.new&&p.new.col)applyRow(p.new)})
    .on('postgres_changes',{event:'*',schema:'public',table:'family_members',filter:'family_id=eq.'+FID},()=>loadMembers())
    .subscribe();
  try{await loadAllDocs();stale=false}catch(e){
    if(!DOCS_READY){STARTED=null;return screen(`<div class="empty-state" style="padding-top:26vh"><h2>Can't load your family budget</h2><p>${esc(isNetErr(e)?'Check your internet connection.':errMsg(e))}</p><button class="btn" data-act="reload">Try again</button></div>`)}
    stale=true;scheduleRender();
  }
  await loadMembers();flushOut();setTimeout(()=>checkReminders(),1200);
}

    <div class="brand"><div class="mark">₹</div><span class="label">Signed in as ${esc(EMAIL)}</span></div>
    <h1 style="font-size:26px">Hi ${esc(MYNAME.split(' ')[0])}</h1>
    ${invs.map(i=>`<section class="card"><div class="label" style="margin-bottom:4px">Invite</div><h2>${esc(i.inviter_name||'Someone')} invited you to ${esc(i.family_name||'their family budget')}</h2>
      <p class="small muted" style="margin:6px 0 12px">You'll join as <b>${ROLEN[i.role]}</b>: ${ROLEHELP[i.role].charAt(0).toLowerCase()+ROLEHELP[i.role].slice(1)} Expires ${new Date(i.expires_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}.</p>
      <div class="btns"><button class="btn primary" data-act="acceptinv" data-id="${i.id}">Join family</button><button class="btn" data-act="declineinv" data-id="${i.id}">Decline</button></div></section>`).join('')}
    <section class="card"><h2 style="margin-bottom:6px">${invs.length?'Or start your own budget':'Start your family budget'}</h2>
      <p class="small muted" style="margin:0 0 12px">You'll be the Owner. Invite family members by their Gmail address after setup.</p>
      <div class="field"><label for="fam-name">Budget name</label><input class="input" id="fam-name" value="Our family budget"></div>
      ${localN?`<label class="check" style="border:0"><input type="checkbox" id="fam-copy" checked><span class="small">Copy the budget already on this device (${localN-1} entries)</span></label>`:''}
      <button class="btn primary block" data-act="createfam">Create family budget</button></section>
    <button class="link" data-act="signout" style="align-self:center">Sign out</button>
  </div>`);
}
async function acceptInvite(id,el){
  el.disabled=true;el.textContent='Joining…';
  const {error}=await SB.rpc('accept_invite',{p_invite:id});
  if(error){toast(errMsg(error));return cloudNoFamily()}
  const {data}=await SB.auth.getUser();afterSignIn(data.user);
}
async function createFamily(el){
  const name=val('fam-name').trim()||'Our family budget';const copy=$('#fam-copy')&&$('#fam-copy').checked;
  el.disabled=true;el.textContent='Creating…';
  const {data:fid,error}=await SB.rpc('create_family',{p_name:name});
  if(error){toast(errMsg(error));el.disabled=false;el.textContent='Create family budget';return}
  FID=fid;FAMNAME=name;ONB=null;
  if(copy){
    try{
      const o=JSON.parse(lsGet('paisa-local')||'{}');const rows=[];
      COLS.forEach(c=>Object.entries(o[c]||{}).forEach(([id,d])=>{
        if(c==='tx'&&d&&(d.by==='local'||!d.by))d={...d,by:ME,ub:ME,byName:MYNAME};
        if(c==='log'&&d&&(d.user==='local'||!d.user))d={...d,user:ME};
        if(c==='settings'&&d)d={...d,name,owner:ME};
        rows.push({family_id:fid,col:c,id,data:d,deleted:false});
      }));
      for(let i=0;i<rows.length;i+=500){const {error:e2}=await SB.from('docs').upsert(rows.slice(i,i+500),{onConflict:'family_id,col,id'});if(e2)throw e2}
      toast('Copied '+rows.length+' items to your family budget.');
    }catch(e){toast("Couldn't copy this device's budget: "+errMsg(e))}
  }
  setRoleFrom('owner');STARTED=null;startCloud();
}

/* -- family screen (cloud) -- */
function familyCloudView(){
  const order={owner:0,admin:1,member:2,viewer:3};
  const ms=MEMBERS.slice().sort((a,b)=>order[a.role]-order[b.role]||(a.name||'').localeCompare(b.name||''));
  const logs=Object.values(D.log).sort((a,b)=>b.at-a.at).slice(0,40);
  const roleRows=[['View dashboard, budgets, entries',1,1,1,1],['Add expenses and income',1,1,1,0],['Edit or delete own entries',1,1,1,0],["Edit anyone's entries",1,1,0,0],['Mark bills and EMIs paid',1,1,1,0],['Change budgets, categories, due dates',1,1,0,0],['Manage loans, cards, goals',1,1,0,0],['Invite and remove members',1,1,0,0],['Hand over ownership, delete family',1,0,0,0]];
  const av=m=>`<div class="avatar">${m.avatar?`<img src="${esc(m.avatar)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}${m.avatar?'':esc((m.name||m.email||'?')[0].toUpperCase())}</div>`;
  return topbar('Family',{month:false})+`<div class="stack">
  <section class="card"><div class="card-head"><h2>${esc(S()?S().name:'Family')}</h2><span class="small muted">${MEMBERS.length} of 8</span></div>
    ${ms.map(m=>`<div class="row">${av(m)}<div class="grow"><div class="t">${esc(m.name||m.email)}${m.id===ME?' <span class="small muted">(you)</span>':''}</div><div class="s">${esc(m.email)}</div></div>
      ${canAdmin()&&m.id!==ME&&m.role!=='owner'?`<select class="input rolesel" data-role="${m.id}" aria-label="Role for ${esc(m.name||m.email)}">${['admin','member','viewer'].map(r=>`<option value="${r}" ${m.role===r?'selected':''}>${ROLEN[r]}</option>`).join('')}</select><button class="btn sm" data-act="memmenu" data-id="${m.id}" aria-label="More for ${esc(m.name||m.email)}">⋯</button>`:`<span class="pill ${m.role==='owner'?'p-paid':'p-up'}">${ROLEN[m.role]}</span>`}
    </div>`).join('')||'<div class="small muted">Loading members…</div>'}
  </section>
  ${canAdmin()?`<section class="card"><h2 style="margin-bottom:10px">Invite by Gmail</h2>
    <div class="field"><label for="inv-email">Gmail address</label><input class="input" id="inv-email" type="email" inputmode="email" autocomplete="off" placeholder="name@gmail.com"></div>
    <div class="flabel" style="margin-bottom:6px">Role</div>
    <div class="seg" role="group" aria-label="Role">${['admin','member','viewer'].map(r=>`<button data-act="invrole" data-k="${r}" aria-pressed="${INVROLE===r}">${ROLEN[r]}</button>`).join('')}</div>
    <p class="small muted" style="margin:6px 0 12px">${ROLEHELP[INVROLE]}</p>
    <button class="btn primary" data-act="invite">Invite</button>
    ${INVITES.length?`<div class="label" style="margin:16px 0 4px">Pending invites</div>${INVITES.map(i=>`<div class="row"><div class="grow"><div class="t">${esc(i.email)}</div><div class="s">${ROLEN[i.role]} · expires ${new Date(i.expires_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div></div><button class="btn sm" data-act="copyinv" data-email="${esc(i.email)}" data-role="${i.role}">Message</button><button class="btn sm danger" data-act="revokeinv" data-id="${i.id}">Revoke</button></div>`).join('')}`:''}
  </section>`:''}
  <section class="card" style="padding-inline:12px"><h2 style="margin:0 4px 8px">What each role can do</h2><div class="tablewrap"><table><thead><tr><th>Action</th><th>Owner</th><th>Admin</th><th>Member</th><th>Viewer</th></tr></thead><tbody>
  ${roleRows.map(r=>`<tr><td style="white-space:normal;min-width:150px">${r[0]}</td>${r.slice(1).map(v=>`<td style="text-align:center">${v?'Yes':'<span class="muted">No</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
  ${canAdmin()?`<section class="card"><h2 style="margin-bottom:6px">Activity</h2>${logs.map(l=>`<div class="row"><div class="grow"><div class="small"><b>${esc(who(l.user))}</b> ${esc(l.action)} ${esc(l.entity)}${l.detail?': '+esc(l.detail):''}</div><div class="s">${new Date(l.at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</div></div></div>`).join('')||'<div class="small muted">No changes yet.</div>'}</section>`:''}
  ${IS_OWNER?'<p class="small muted" style="margin:0 4px">To leave this family, first make an Admin the Owner (tap ⋯ next to them).</p>':'<button class="btn danger block" data-act="leave">Leave family</button>'}
  <a class="btn block" href="#prefs" style="text-align:center;text-decoration:none">Settings, import, export and app lock</a>
  </div>`;
}
function inviteMessage(email,role){
  const fam=S()?S().name:'our family budget';
  return `${MYNAME} invited you to "${fam}" on Paisa Planner as ${ROLEN[role]}.\n\nOpen ${location.origin+location.pathname} and tap "Continue with Google" using ${email}. The invite expires in 7 days.`;
}
async function sendInvite(el){
  const email=val('inv-email').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('Enter a valid Gmail address.');return}
  el.disabled=true;
  const {error}=await SB.rpc('invite_member',{p_email:email,p_role:INVROLE});
  el.disabled=false;
  if(error){toast(errMsg(error));return}
  log('invited','member',email+' as '+ROLEN[INVROLE]);
  loadMembers();copyInvite(email,INVROLE,true);
}
function copyInvite(email,role,fresh){
  INVMSG=inviteMessage(email,role);
  openSheet(`${sheetHead(fresh?'Invite created':'Invite message')}
    <p class="small" style="margin-top:0">${esc(email)} will see the invite when they sign in with that Gmail address. Send them this message so they know where to go:</p>
    <div class="input" style="white-space:pre-wrap;font-size:14px;margin-bottom:12px">${esc(INVMSG)}</div>
    <div class="btns">${navigator.share?'<button class="btn primary" data-act="sharemsg">Share…</button>':''}<button class="btn ${navigator.share?'':'primary'}" data-act="copymsg">Copy message</button></div>`);
}
async function shareText(text){try{await navigator.share({text})}catch(e){}}
function copyText(text){navigator.clipboard.writeText(text).then(()=>toast('Copied.'),()=>toast('Select the message and copy it.'))}
async function setRole(uid,role,sel){
  sel.disabled=true;
  const {error}=await SB.rpc('set_member_role',{p_user:uid,p_role:role});
  sel.disabled=false;
  if(error){toast(errMsg(error));loadMembers();return}
  log('changed','role',(NAMES[uid]||'member')+' to '+ROLEN[role]);
  toast((NAMES[uid]||'They')+' is now '+ROLEN[role]+'.');loadMembers();
}
function memberMenu(uid){
  const m=MEMBERS.find(x=>x.id===uid);if(!m)return;
  openSheet(`${sheetHead(esc(m.name||m.email))}<p class="small muted" style="margin-top:0">${esc(m.email)} · ${ROLEN[m.role]}</p>
    ${IS_OWNER?(m.role==='admin'?`<button class="btn block" data-act="makeowner" data-id="${uid}">Make Owner</button>`:'<p class="small muted">To make them the Owner, change their role to Admin first.</p>'):''}
    <button class="btn danger block" style="margin-top:8px" data-act="removemem" data-id="${uid}">Remove from family</button>`);
}
function confirmSheet(title,body,okLabel,fn){
  CONFIRMFN=fn;
  openSheet(`${sheetHead(title)}<p class="small" style="margin-top:0">${body}</p><button class="btn danger block" data-act="confirmok">${okLabel}</button>`);
}

/* ================= PWA plumbing ================= */
let INSTALL_EVT=null,UPDATE=false,OFFLINE=!navigator.onLine,SWREG=null;
const STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const IS_IOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const NOTIF_SUPPORT='Notification' in window;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EVT=e;if(route==='prefs')render()});
window.addEventListener('appinstalled',()=>{INSTALL_EVT=null;render()});
window.addEventListener('online',()=>{OFFLINE=false;render()});
window.addEventListener('offline',()=>{OFFLINE=true;render()});
// keep data in sync if the app is open in two tabs
window.addEventListener('storage',e=>{if(e.key==='paisa-local'&&e.newValue){try{const o=JSON.parse(e.newValue);COLS.forEach(c=>D[c]=o[c]||{});changed()}catch(x){}}});
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    SWREG=reg;
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){UPDATE=true;render()}})});
  }).catch(()=>{});
}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
async function notify(title,body){
  if(!NOTIF_SUPPORT||Notification.permission!=='granted')return false;
  const opts={body,icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:'paisa-dues',data:{url:'./#bills'}};
  try{const reg=SWREG||(navigator.serviceWorker&&await navigator.serviceWorker.ready);if(reg){await reg.showNotification(title,opts);return true}}catch(e){}
  try{new Notification(title,opts);return true}catch(e){return false}
}
function checkReminders(force){
  if(!S()||!NOTIF_SUPPORT||Notification.permission!=='granted'||lsGet('paisa-remind')==='off')return;
  const t=todayISO();if(!force&&lsGet('paisa-remind-day')===t)return;
  const ds=billsFor(curKey()).filter(b=>b.st==='due'||b.st==='overdue');
  lsSet('paisa-remind-day',t);
  if(!ds.length)return;
  const over=ds.filter(b=>b.st==='overdue');
  const title=over.length?over.length+' payment'+(over.length>1?'s':'')+' overdue':ds.length+' payment'+(ds.length>1?'s':'')+' due soon';
  notify(title,ds.slice(0,4).map(b=>b.name+' · '+fmt(b.budget)+' · '+b.label).join('\n'));
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});
async function backup(){
  const payload=JSON.stringify({app:'paisa-planner',version:1,exportedAt:new Date().toISOString(),data:D},null,1);
  await saveFile('Paisa Planner backup '+todayISO()+'.json',new Blob([payload],{type:'application/json'}));
  lsSet('paisa-backup-at',String(Date.now()));render();
}
let RESTORE=null;
async function handleRestore(file){
  let o;try{o=JSON.parse(await file.text())}catch(e){toast("That file isn't a Paisa Planner backup.");return}
  if(!o||o.app!=='paisa-planner'||!o.data||typeof o.data!=='object'){toast("That file isn't a Paisa Planner backup.");return}
  RESTORE=o;const n=Object.keys(o.data.tx||{}).length,c=Object.keys(o.data.cats||{}).length;
  openSheet(`${sheetHead('Restore backup?')}<p class="small">Backup from ${esc(new Date(o.exportedAt).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}))}: ${n} entries and ${c} categories.</p><p class="small muted">This replaces everything currently on this device.</p><button class="btn primary block" data-act="dorestore">Replace and restore</button>`);
}
function doRestore(){
  if(!RESTORE)return;COLS.forEach(c=>D[c]=RESTORE.data[c]&&typeof RESTORE.data[c]==='object'?RESTORE.data[c]:{});
  RESTORE=null;saveLocal();closeSheet();VM=null;changed();toast('Backup restored.');
}

(async function boot(){
  USER=null;await resolveRole();
  if(CLOUD){if(lsGet('paisa-pin'))showLock('unlock');cloudBoot();return}
  startLocal();
  if(lsGet('paisa-pin'))showLock('unlock');
  // wait for first data (remote) then render
  const go=()=>{setRoute()};
  if(MODE==='local'){go();setTimeout(()=>checkReminders(),1500)}
  else{const iv=setInterval(()=>{if(render.ready){clearInterval(iv);go()}},50)}
})();
</script>
